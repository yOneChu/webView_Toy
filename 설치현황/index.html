<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>엘리베이터 설치 현황 대시보드</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    :root{
      --primary-color:#1e3a8a;--secondary-color:#3b82f6;--accent-color:#f59e0b;
      --success-color:#10b981;--dark-color:#1f2937;--light-gray:#f8fafc;
    }
    body{font-family:'Noto Sans KR',Arial,sans-serif;background:var(--light-gray);color:var(--dark-color)}
    .navbar{background:linear-gradient(135deg,var(--primary-color) 0%,var(--secondary-color) 100%);box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .navbar-brand{font-weight:700;font-size:1.5rem}
    .card{border:none;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);transition:transform .2s}
    .card:hover{transform:translateY(-2px);box-shadow:0 8px 15px rgba(0,0,0,.1)}
    .stats-card{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .stats-card.success{background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%)}
    .stats-card.warning{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
    .stats-card.info{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)}
    .table-container{background:#fff;border-radius:12px;overflow:hidden}
    .table{margin-bottom:0}
    .table thead th{background:var(--primary-color);color:#fff;border:none;font-weight:600;padding:1rem}
    .table tbody tr{transition:background-color .2s}
    .table tbody tr:hover{background:rgba(59,130,246,.05)}
    .table tbody td{padding:.875rem 1rem;vertical-align:middle}
    .filter-section{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:0 2px 4px rgba(0,0,0,.05)}
    .btn-primary{background:linear-gradient(135deg,var(--primary-color) 0%,var(--secondary-color) 100%);border:none;border-radius:8px;padding:.5rem 1.5rem;font-weight:600}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 8px rgba(59,130,246,.3)}
    #map{height:400px;border-radius:12px;border:2px solid #e5e7eb}
    .chart-container{background:#fff;border-radius:12px;padding:1.5rem;height:400px}
    .badge{font-size:.75rem;padding:.375rem .75rem}
    .search-box{position:relative}
    .search-box input{border-radius:25px;padding-left:2.5rem;border:2px solid #e5e7eb;transition:border-color .2s}
    .search-box input:focus{border-color:var(--secondary-color);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .search-box .fa-magnifying-glass{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#9ca3af}
    .loading-spinner{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.8);z-index:9999}
    .spinner-border{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  </style>
</head>
<body>
  <div class="loading-spinner" id="loadingSpinner">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
  </div>

  <!-- Nav -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        <i class="fa-solid fa-building me-2"></i> 엘리베이터 설치 현황 대시보드
      </a>
      <div class="navbar-nav ms-auto">
        <span class="navbar-text">
          <i class="fa-solid fa-calendar me-1"></i>
          <span id="currentDate"></span>
        </span>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-4">
    <!-- Stats -->
    <div class="row mb-4">
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card stats-card">
          <div class="card-body text-center">
            <i class="fa-solid fa-building fa-2x mb-3"></i>
            <h3 class="mb-1" id="totalElevators">1,234</h3>
            <p class="mb-0">총 설치대수</p>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card stats-card success">
          <div class="card-body text-center">
            <i class="fa-solid fa-location-dot fa-2x mb-3"></i>
            <h3 class="mb-1" id="totalRegions">45</h3>
            <p class="mb-0">설치 지역수</p>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card stats-card warning">
          <div class="card-body text-center">
            <i class="fa-solid fa-gears fa-2x mb-3"></i>
            <h3 class="mb-1" id="totalModels">12</h3>
            <p class="mb-0">엘리베이터 기종수</p>
          </div>
        </div>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <div class="card stats-card info">
          <div class="card-body text-center">
            <i class="fa-solid fa-calendar-plus fa-2x mb-3"></i>
            <h3 class="mb-1" id="thisYearInstalls">89</h3>
            <p class="mb-0">금년 설치대수</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-section">
      <div class="row align-items-center">
        <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
          <label class="form-label fw-semibold">지역 선택</label>
          <select class="form-select" id="regionFilter">
            <option value="">전체 지역</option>
            <option value="서울">서울특별시</option><option value="부산">부산광역시</option>
            <option value="대구">대구광역시</option><option value="인천">인천광역시</option>
            <option value="광주">광주광역시</option><option value="대전">대전광역시</option>
          </select>
        </div>
        <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
          <label class="form-label fw-semibold">기종 선택</label>
          <select class="form-select" id="modelFilter">
            <option value="">전체 기종</option>
            <option value="HE-100">HE-100</option><option value="HE-200">HE-200</option>
            <option value="HE-300">HE-300</option><option value="Premium">Premium</option>
            <option value="Standard">Standard</option>
          </select>
        </div>
        <div class="col-lg-3 col-md-6 mb-3 mb-lg-0">
          <label class="form-label fw-semibold">설치년도</label>
          <select class="form-select" id="yearFilter">
            <option value="">전체 년도</option>
            <option value="2025">2025</option><option value="2024">2024</option>
            <option value="2023">2023</option><option value="2022">2022</option>
            <option value="2021">2021</option><option value="2020">2020</option>
          </select>
        </div>
        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold">검색</label>
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="form-control" id="searchInput" placeholder="주소 검색...">
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-auto">
          <button class="btn btn-primary me-2" onclick="applyFilters()">
            <i class="fa-solid fa-filter me-1"></i>필터 적용
          </button>
          <button class="btn btn-outline-secondary" onclick="resetFilters()">
            <i class="fa-solid fa-rotate-right me-1"></i>초기화
          </button>
        </div>
      </div>
    </div>

    <!-- Map + Chart -->
    <div class="row mb-4">
      <div class="col-lg-8 mb-4">
        <div class="card">
          <div class="card-header bg-white">
            <h5 class="card-title mb-0"><i class="fa-solid fa-map me-2 text-primary"></i>설치 위치 지도</h5>
          </div>
          <div class="card-body p-0"><div id="map"></div></div>
        </div>
      </div>
      <div class="col-lg-4 mb-4">
        <div class="card h-100">
          <div class="card-header bg-white">
            <h5 class="card-title mb-0"><i class="fa-solid fa-chart-pie me-2 text-primary"></i>기종별 분포</h5>
          </div>
          <div class="card-body">
            <div class="chart-container"><canvas id="modelChart"></canvas></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="row">
      <div class="col-12">
        <div class="card table-container">
          <div class="card-header bg-white border-bottom">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="card-title mb-0"><i class="fa-solid fa-table me-2 text-primary"></i>엘리베이터 설치 현황</h5>
              <div class="d-flex align-items-center">
                <span class="badge bg-secondary me-2" id="totalCount">전체: 1,234건</span>
                <button class="btn btn-sm btn-outline-primary" onclick="exportToCSV()">
                  <i class="fa-solid fa-download me-1"></i>CSV 다운로드
                </button>
              </div>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover" id="elevatorTable">
                <thead>
                <tr>
                  <th>번호</th><th>기종</th><th>설치주소</th><th>설치년도</th><th>상태</th><th>액션</th>
                </tr>
                </thead>
                <tbody id="elevatorTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="row mt-4 mb-4">
      <div class="col-12">
        <nav aria-label="Page navigation">
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

  <script>
    // 샘플 데이터
    const elevatorData = [
      { id:1, model:'HE-100', address:'서울특별시 강남구 테헤란로 123', year:2024, status:'정상', lat:37.5013, lng:127.0395 },
      { id:2, model:'HE-200', address:'서울특별시 종로구 세종대로 45', year:2024, status:'정상', lat:37.5719, lng:126.9794 },
      { id:3, model:'Premium', address:'부산광역시 해운대구 해운대해변로 264', year:2023, status:'점검중', lat:35.1588, lng:129.1603 },
      { id:4, model:'HE-300', address:'대구광역시 중구 국채보상로 102', year:2023, status:'정상', lat:35.8722, lng:128.6025 },
      { id:5, model:'Standard', address:'인천광역시 연수구 컨벤시아대로 165', year:2022, status:'정상', lat:37.4138, lng:126.6378 },
      { id:6, model:'HE-100', address:'광주광역시 서구 상무중앙로 15', year:2024, status:'정상', lat:35.1595, lng:126.8526 },
      { id:7, model:'HE-200', address:'대전광역시 서구 둔산로 100', year:2023, status:'정상', lat:36.3398, lng:127.3940 },
      { id:8, model:'Premium', address:'서울특별시 마포구 월드컵북로 396', year:2024, status:'정상', lat:37.5665, lng:126.8996 },
      { id:9, model:'HE-300', address:'서울특별시 송파구 올림픽로 300', year:2022, status:'점검중', lat:37.5145, lng:127.1066 },
      { id:10, model:'Standard', address:'부산광역시 중구 중앙대로 94', year:2023, status:'정상', lat:35.1040, lng:129.0350 }
    ];

    let currentData = [...elevatorData];
    let currentPage = 1;
    const itemsPerPage = 5;
    let map, markerGroup, modelChart;

    document.addEventListener('DOMContentLoaded', () => {
      initializeDate();
      initializeMap();
      initializeChart();
      renderTable();
      updateStatistics();
      setupEventListeners();
    });

    function initializeDate(){
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString('ko-KR');
    }

    function initializeMap(){
      map = L.map('map').setView([37.5665,126.9780], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
      markerGroup = L.layerGroup().addTo(map);
      updateMapMarkers();
    }

    function updateMapMarkers(){
      markerGroup.clearLayers();
      currentData.forEach(e => {
        const color = e.status === '정상' ? '#10b981' : '#f59e0b';
        const marker = L.circleMarker([e.lat, e.lng],{
          radius:8,color,fillColor:color,fillOpacity:0.85,weight:2
        }).addTo(markerGroup);
        marker.bindPopup(`
          <div class="p-2">
            <h6 class="mb-2">${e.model}</h6>
            <p class="mb-1 small">${e.address}</p>
            <p class="mb-1 small">설치년도: ${e.year}</p>
            <span class="badge ${e.status==='정상'?'bg-success':'bg-warning'}">${e.status}</span>
          </div>
        `);
      });
    }

    function initializeChart(){
      const ctx = document.getElementById('modelChart').getContext('2d');
      const {labels, data} = getModelCounts(elevatorData);
      modelChart = new Chart(ctx,{
        type:'doughnut',
        data:{
          labels,
          datasets:[{
            data,
            backgroundColor:['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'],
            borderWidth:0
          }]
        },
        options:{
          responsive:true,maintainAspectRatio:false,
          plugins:{ legend:{ position:'bottom' } }
        }
      });
    }

    function getModelCounts(list){
      const counts = list.reduce((acc,cur)=>{acc[cur.model]=(acc[cur.model]||0)+1;return acc;}, {});
      const labels = Object.keys(counts);
      const data = labels.map(l=>counts[l]);
      return {labels,data};
    }

    function updateChart(){
      const {labels,data} = getModelCounts(currentData);
      modelChart.data.labels = labels;
      modelChart.data.datasets[0].data = data;
      modelChart.update();
    }

    function renderTable(){
      const tbody = document.getElementById('elevatorTableBody');
      const startIndex = (currentPage-1)*itemsPerPage;
      const pageData = currentData.slice(startIndex, startIndex+itemsPerPage);

      tbody.innerHTML = pageData.map((e,i)=>`
        <tr>
          <td>${startIndex + i + 1}</td>
          <td><span class="badge bg-primary">${e.model}</span></td>
          <td>${e.address}</td>
          <td>${e.year}</td>
          <td><span class="badge ${e.status==='정상'?'bg-success':'bg-warning'}">${e.status}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="viewDetails(${e.id})"><i class="fa-solid fa-eye"></i></button>
            <button class="btn btn-sm btn-outline-info" onclick="showOnMap(${e.lat}, ${e.lng})"><i class="fa-solid fa-location-dot"></i></button>
          </td>
        </tr>
      `).join('');

      renderPagination();
      updateTotalCount();
    }

    function renderPagination(){
      const pagination = document.getElementById('pagination');
      const totalPages = Math.ceil(currentData.length / itemsPerPage);
      if(totalPages<=1){ pagination.innerHTML=''; return; }

      let html = `
        <li class="page-item ${currentPage===1?'disabled':''}">
          <a class="page-link" href="#" onclick="event.preventDefault(); changePage(${currentPage-1})">이전</a>
        </li>
      `;
      for(let i=1;i<=totalPages;i++){
        html += `
          <li class="page-item ${currentPage===i?'active':''}">
            <a class="page-link" href="#" onclick="event.preventDefault(); changePage(${i})">${i}</a>
          </li>
        `;
      }
      html += `
        <li class="page-item ${currentPage===totalPages?'disabled':''}">
          <a class="page-link" href="#" onclick="event.preventDefault(); changePage(${currentPage+1})">다음</a>
        </li>
      `;
      pagination.innerHTML = html;
    }

    function changePage(page){
      const totalPages = Math.ceil(currentData.length / itemsPerPage);
      if(page>=1 && page<=totalPages){ currentPage = page; renderTable(); }
    }

    function updateStatistics(){
      document.getElementById('totalElevators').textContent = elevatorData.length.toLocaleString();
      const regions = [...new Set(elevatorData.map(e=>e.address.split(' ')[0]))];
      document.getElementById('totalRegions').textContent = regions.length;
      const models = [...new Set(elevatorData.map(e=>e.model))];
      document.getElementById('totalModels').textContent = models.length;
      const thisYear = new Date().getFullYear();
      const thisYearCount = elevatorData.filter(e=>e.year===thisYear).length;
      document.getElementById('thisYearInstalls').textContent = thisYearCount;
    }

    function updateTotalCount(){
      document.getElementById('totalCount').textContent = `전체: ${currentData.length.toLocaleString()}건`;
    }

    function setupEventListeners(){
      document.getElementById('searchInput').addEventListener('input', debounce(applyFilters,300));
    }

    function applyFilters(){
      showLoading();
      setTimeout(()=>{
        const region = document.getElementById('regionFilter').value;
        const model = document.getElementById('modelFilter').value;
        const year = document.getElementById('yearFilter').value;
        const search = document.getElementById('searchInput').value.toLowerCase();

        currentData = elevatorData.filter(e =>
          (!region || e.address.includes(region)) &&
          (!model || e.model===model) &&
          (!year || e.year.toString()===year) &&
          (!search || e.address.toLowerCase().includes(search))
        );

        currentPage = 1;
        renderTable();
        updateMapMarkers();
        updateChart();
        hideLoading();
      },500);
    }

    function resetFilters(){
      document.getElementById('regionFilter').value='';
      document.getElementById('modelFilter').value='';
      document.getElementById('yearFilter').value='';
      document.getElementById('searchInput').value='';
      currentData = [...elevatorData];
      currentPage = 1;
      renderTable();
      updateMapMarkers();
      updateChart();
    }

    function viewDetails(id){
      const e = elevatorData.find(x=>x.id===id);
      if(e){
        alert(`엘리베이터 상세 정보\n\n기종: ${e.model}\n주소: ${e.address}\n설치년도: ${e.year}\n상태: ${e.status}`);
      }
    }

    function showOnMap(lat,lng){
      map.setView([lat,lng], 15);
      document.getElementById('map').scrollIntoView({behavior:'smooth'});
    }

    function exportToCSV(){
      const csvContent = [
        ['번호','기종','설치주소','설치년도','상태'],
        ...currentData.map((e,i)=>[i+1,e.model,e.address,e.year,e.status])
      ].map(r=>r.join(',')).join('\n');

      const blob = new Blob(['\uFEFF'+csvContent],{type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `엘리베이터_설치현황_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(()=>URL.revokeObjectURL(url), 0);
    }

    function showLoading(){ document.getElementById('loadingSpinner').style.display='block'; }
    function hideLoading(){ document.getElementById('loadingSpinner').style.display='none'; }

    function debounce(fn, wait){
      let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
    }
  </script>
</body>
</html>
