<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLM E/L 현장 조회</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex overflow-hidden">

<!-- 좌측 검색 조건 사이드바 -->
<aside class="w-[360px] bg-white border-r border-slate-200 flex flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.02)] z-10">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-200 bg-indigo-50/40">
        <h2 class="text-[17px] font-bold text-indigo-900 flex items-center gap-2.5">
            <i class="fas fa-search text-indigo-600"></i>
            E/L 검색조건
        </h2>
    </div>

    <!-- Scrollable Form Area -->
    <div class="flex-1 overflow-y-auto p-6 space-y-7">

        <!-- 1. SELECTION -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                <i class="fas fa-layer-group text-slate-400 text-xs"></i> SELECTION
            </label>
            <div class="relative">
                <select class="w-full appearance-none border border-slate-300 rounded-lg bg-white px-3.5 py-2.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow shadow-sm cursor-pointer hover:border-slate-400">
                    <option>엘리베이터</option>
                    <option>에스컬레이터</option>
                    <option>무빙워크</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                    <i class="fas fa-chevron-down text-xs"></i>
                </div>
            </div>
        </div>

        <!-- 2. 영업사양 (Dynamic List) -->
        <div>
            <div class="flex justify-between items-end mb-3">
                <label class="block text-sm font-bold text-slate-700 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-slate-400 text-xs"></i> 영업사양
                </label>
                <button type="button" onclick="addSpecRow()" class="text-xs text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 font-semibold flex items-center gap-1 px-2.5 py-1.5 rounded transition-colors">
                    <i class="fas fa-plus"></i> 조건 추가
                </button>
            </div>

            <div class="grid grid-cols-[auto_1fr_1fr_auto] gap-2 mb-2 px-1">
                <div class="w-5"></div>
                <div class="text-[11px] font-semibold text-slate-500 text-center uppercase tracking-wider">특성 CODE</div>
                <div class="text-[11px] font-semibold text-slate-500 text-center uppercase tracking-wider">값 CODE</div>
                <div class="w-6"></div>
            </div>

            <!-- Input Rows Container -->
            <div id="specContainer" class="space-y-2">
                <!-- JavaScript로 동적 추가됨 -->
            </div>
        </div>

        <!-- 3. Date -->
        <div class="pb-4">
            <div class="flex justify-between items-center mb-3">
                <label class="block text-sm font-bold text-slate-700 flex items-center gap-2">
                    <i class="far fa-calendar-alt text-slate-400 text-xs"></i> 등록/수정 기간
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer group">
                    <input type="checkbox" id="recentYearBtn" class="w-4 h-4 text-indigo-600 bg-white border-slate-300 rounded focus:ring-indigo-500 focus:ring-2 cursor-pointer transition-all" onchange="setRecentYear(this)">
                    <span class="text-xs text-slate-600 group-hover:text-indigo-700 font-medium transition-colors">최근 1년</span>
                </label>
            </div>
            <div class="flex items-center gap-2">
                <input type="date" id="startDate" class="w-full border border-slate-300 rounded-lg bg-white px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-shadow">
                <span class="text-slate-400 text-sm font-medium">~</span>
                <input type="date" id="endDate" class="w-full border border-slate-300 rounded-lg bg-white px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-shadow">
            </div>
        </div>
    </div>

    <!-- Footer / Action Area -->
    <div class="p-5 border-t border-slate-200 bg-slate-50">
        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
            <i class="fas fa-search"></i> 검색 (Search)
        </button>
        <button class="w-full mt-2 text-slate-500 hover:text-slate-700 text-sm font-medium py-2 transition-colors">
            조건 초기화
        </button>
    </div>
</aside>

<!-- 우측 메인 콘텐츠 영역 (검색 결과) -->
<main class="flex-1 bg-slate-100 p-8">
    <div class="h-full border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center bg-slate-50/50">
        <div class="text-center">
            <div class="w-16 h-16 bg-white border border-slate-200 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm">
                <i class="fas fa-table text-2xl text-slate-400"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-700 mb-1">검색 결과를 확인할 수 있습니다</h3>
            <p class="text-sm text-slate-500">좌측 패널에서 E/L 검색 조건을 입력하고 검색을 실행해 주세요.</p>
        </div>
    </div>
</main>

<script>
    // 영업사양 동적 로직
    let rowCount = 0;
    const maxRows = 10;

    function addSpecRow() {
        if (rowCount >= maxRows) {
            alert('영업사양 조건은 최대 10개까지 추가할 수 있습니다.');
            return;
        }
        rowCount++;
        const container = document.getElementById('specContainer');
        const row = document.createElement('div');
        row.className = 'grid grid-cols-[auto_1fr_1fr_auto] gap-2 items-center group animate-fade-in';
        row.innerHTML = `
                <span class="text-[11px] text-slate-400 w-5 text-center font-mono font-medium">${rowCount}</span>
                <input type="text" placeholder="특성 입력" class="w-full border border-slate-300 rounded-md px-3 py-1.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all uppercase placeholder:text-slate-300 placeholder:normal-case shadow-sm">
                <input type="text" placeholder="값 입력" class="w-full border border-slate-300 rounded-md px-3 py-1.5 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all uppercase placeholder:text-slate-300 placeholder:normal-case shadow-sm">
                <button onclick="removeRow(this)" class="w-6 h-6 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded transition-colors" title="삭제">
                    <i class="fas fa-times text-sm"></i>
                </button>
            `;
        container.appendChild(row);
        updateRowNumbers();
    }

    function removeRow(btn) {
        btn.parentElement.remove();
        updateRowNumbers();
    }

    function updateRowNumbers() {
        const rows = document.getElementById('specContainer').children;
        rowCount = rows.length;
        Array.from(rows).forEach((row, index) => {
            row.querySelector('span').innerText = index + 1;
        });
    }

    // 최근 1년 날짜 세팅 로직
    function setRecentYear(checkbox) {
        const startInput = document.getElementById('startDate');
        const endInput = document.getElementById('endDate');

        if (checkbox.checked) {
            const today = new Date();
            const lastYear = new Date();
            lastYear.setFullYear(today.getFullYear() - 1);

            // 로컬 타임존 기준으로 YYYY-MM-DD 포맷 맞추기
            const offset = today.getTimezoneOffset() * 60000;
            const localToday = new Date(today.getTime() - offset).toISOString().split('T')[0];
            const localLastYear = new Date(lastYear.getTime() - offset).toISOString().split('T')[0];

            endInput.value = localToday;
            startInput.value = localLastYear;
        } else {
            startInput.value = '';
            endInput.value = '';
        }
    }

    // 초기 화면 로드 시 영업사양 3줄 기본 세팅
    window.onload = () => {
        addSpecRow();
        addSpecRow();
        addSpecRow();
    };
</script>
<style>
    /* 부드러운 UI 생성을 위한 간단한 애니메이션 */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.2s ease-out forwards;
    }
</style>
</body>
</html>
