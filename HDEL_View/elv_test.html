<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공사정보 검색 (영업사양 코드)</title>

    <!-- Bootstrap CSS -->
    <link
            rel="stylesheet"
            href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #f5f6f8;
        }
        .search-card {
            margin-top: 30px;
        }
        .condition-row + .condition-row {
            margin-top: 8px;
        }
        .condition-connector {
            min-width: 80px;
        }
        .condition-index {
            font-weight: 600;
            color: #6c757d;
        }
        .result-card {
            margin-top: 20px;
        }
        .badge-connector {
            font-size: 0.75rem;
        }
        .table-sm td, .table-sm th {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 검색조건 영역 -->
    <div class="card search-card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <strong>공사정보 검색</strong>
                <small class="text-muted ml-2">영업사양 코드를 조건으로 공사정보를 조회합니다.</small>
            </div>
            <button id="btnSearch" class="btn btn-primary btn-sm">
                <span class="mr-1">&#128269;</span> 검색
            </button>
        </div>
        <div class="card-body">
            <!-- 기본 정보 영역 (예: 기간, 브랜드 등 넣고 싶으면 여기에 추가) -->
            <div class="mb-3">
                <h6 class="mb-2">검색 조건</h6>
                <small class="text-muted">
                    여러 개의 영업사양 코드를 조합하여 검색할 수 있습니다. (예: AND / OR 조건)
                </small>
            </div>

            <!-- 동적 검색조건 영역 -->
            <div id="conditionContainer"></div>

            <div class="mt-3">
                <button id="btnAddCondition" class="btn btn-outline-secondary btn-sm">
                    + 검색조건 추가
                </button>
            </div>
        </div>
    </div>

    <!-- 검색 결과 영역 -->
    <div class="card result-card">
        <div class="card-header">
            <strong>검색 결과</strong>
            <small class="text-muted ml-2">(샘플)</small>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-sm table-striped mb-0">
                    <thead class="thead-light">
                    <tr>
                        <th style="width: 120px;">공사번호</th>
                        <th>현장명</th>
                        <th style="width: 80px;">브랜드</th>
                        <th style="width: 80px;">속도</th>
                        <th style="width: 140px;">영업사양 코드</th>
                        <th style="width: 100px;">상태</th>
                    </tr>
                    </thead>
                    <tbody id="resultTbody">
                    <!-- 샘플 행 -->
                    <tr>
                        <td>W2025-00123</td>
                        <td>서울 ○○타워 신축공사</td>
                        <td>HYUNDAI</td>
                        <td>105 m/min</td>
                        <td>SPC_A01</td>
                        <td><span class="badge badge-success">진행중</span></td>
                    </tr>
                    <tr>
                        <td>W2025-00124</td>
                        <td>부산 ○○ 오피스텔</td>
                        <td>HYUNDAI</td>
                        <td>60 m/min</td>
                        <td>SPC_B02</td>
                        <td><span class="badge badge-secondary">완료</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- JS: jQuery + Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script
        src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js">
</script>

<script>
    // 조건 행 index를 위한 카운터
    let conditionCount = 0;

    // 조건 행 생성 함수
    function createConditionRow(index) {
        const row = document.createElement('div');
        row.className = 'row condition-row align-items-center';
        row.dataset.index = index;

        // 첫 번째 조건은 AND/OR 연결자 숨김
        const isFirst = index === 0;

        row.innerHTML = `
            <!-- AND / OR -->
            <div class="col-md-2 mb-1">
                <div class="d-flex align-items-center">
                    ${isFirst ? `
                        <span class="condition-index">조건 ${index + 1}</span>
                    ` : `
                        <select class="form-control form-control-sm condition-connector">
                            <option value="AND">AND</option>
                            <option value="OR">OR</option>
                        </select>
                    `}
                </div>
            </div>

            <!-- 영업사양 코드 입력 -->
            <div class="col-md-6 mb-1">
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                        <span class="input-group-text">영업사양 코드</span>
                    </div>
                    <input type="text" class="form-control condition-spec-code"
                           placeholder="예: SPC_A01, SPC_B02">
                </div>
            </div>

            <!-- 옵션 (일치/포함 등) -->
            <div class="col-md-2 mb-1">
                <select class="form-control form-control-sm condition-operator">
                    <option value="EQUAL">코드 일치</option>
                    <option value="LIKE">코드 포함</option>
                    <option value="START">코드 시작값</option>
                </select>
            </div>

            <!-- 삭제 버튼 -->
            <div class="col-md-2 mb-1 text-right">
                ${isFirst ? '' : `
                    <button class="btn btn-outline-danger btn-sm btn-remove-condition">
                        삭제
                    </button>
                `}
            </div>
        `;
        return row;
    }

    // 조건 추가 함수
    function addCondition() {
        const container = document.getElementById('conditionContainer');
        const row = createConditionRow(conditionCount);
        container.appendChild(row);
        conditionCount++;
    }

    // 초기 1개 조건 생성
    document.addEventListener('DOMContentLoaded', function () {
        addCondition();

        // "검색조건 추가" 버튼
        document.getElementById('btnAddCondition').addEventListener('click', function () {
            addCondition();
        });

        // 삭제 버튼 이벤트 (event delegation)
        document.getElementById('conditionContainer').addEventListener('click', function (e) {
            if (e.target.classList.contains('btn-remove-condition')) {
                const row = e.target.closest('.condition-row');
                row.parentNode.removeChild(row);
            }
        });

        // 검색 버튼 클릭 시 현재 조건 읽기 (백엔드 연동 시 활용)
        document.getElementById('btnSearch').addEventListener('click', function () {
            const rows = document.querySelectorAll('.condition-row');
            const conditions = [];

            rows.forEach((row, idx) => {
                const connectorEl = row.querySelector('.condition-connector');
                const specInput = row.querySelector('.condition-spec-code');
                const opSelect = row.querySelector('.condition-operator');

                conditions.push({
                    index: idx,
                    connector: idx === 0 ? null : (connectorEl ? connectorEl.value : null),
                    specCode: specInput ? specInput.value.trim() : '',
                    operator: opSelect ? opSelect.value : 'EQUAL'
                });
            });

            console.log('검색 조건:', conditions);
            alert('콘솔에서 검색 조건을 확인하세요 (실제 연동 시 AJAX 호출로 변경).');
        });
    });
</script>

</body>
</html>
