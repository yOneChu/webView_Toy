<!doctype html>
<html lang="ko">
<head>

    <!-- TailwindCSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 다크모드: class 전략 사용 (최근 작업과 동일하게 다크모드 지원)
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { mr: '#2563eb', mrl: '#0d9488', luxen: '#9333ea' }
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

        .st-add     { background-color: #ecfdf5; }   /* emerald-50 */
        .st-remove  { background-color: #fff1f2; }   /* rose-50   */
        .st-change  { background-color: #fffbeb; }   /* amber-50  */
        .dark .st-add    { background-color: rgba(6,78,59,0.30); }
        .dark .st-remove { background-color: rgba(136,19,55,0.30); }
        .dark .st-change { background-color: rgba(120,53,15,0.30); }
        .st-missing { color: #d1d5db; font-style: italic; }
        .dark .st-missing { color: #4b5563; }

        thead th { position: sticky; top: 0; z-index: 10; }
    </style>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 min-h-screen">

    <!-- ───────── 모드 탭 ───────── -->

        <button data-tab="cross"

    html.classList.toggle('dark', on);
    darkLabel.textContent = on ? '라이트' : '다크';
    localStorage.setItem('bom-dark', on ? '1' : '0');
}

    () => applyDark(!html.classList.contains('dark')));

function P(pn, name, spec, qty) {
    return { pn, name, spec, qty, unit: UNITS[name] || 'EA' };
}
// 각 기종의 최신 버전 키
const latestVersion = b => Object.keys(BOM[b]).slice(-1)[0];

/*****************************************************************************
 * 2) 탭 전환
 *****************************************************************************/
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => {
            const on = b === btn;
            b.classList.toggle('border-blue-600', on);
            b.classList.toggle('text-blue-600', on);
            b.classList.toggle('font-semibold', on);
            b.classList.toggle('border-transparent', !on);
            b.classList.toggle('text-gray-500', !on);
        });
        document.getElementById('tab-cross').classList.toggle('hidden', tab !== 'cross');
        document.getElementById('tab-version').classList.toggle('hidden', tab !== 'version');
    });
});

/*****************************************************************************
 * 3) 기종 간 비교 (각 기종의 최신 버전 BOM을 품번 기준으로 매칭)
 *****************************************************************************/
function summaryCard(label, value, color) {
    return `<div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-3">
        <div class="text-2xl font-bold ${color}">${value}</div>
        <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${label}</div>
    </div>`;
}

function renderCross() {
    const brands = [...document.querySelectorAll('.cross-brand:checked')].map(c => c.value);
    const onlyDiff = document.getElementById('onlyDiff').checked;
    const q = document.getElementById('crossSearch').value.trim().toLowerCase();

    // 품번 기준으로 모든 부품 통합
    const map = new Map(); // pn -> { name, spec, perBrand:{brand:item} }
    brands.forEach(b => {
        BOM[b][latestVersion(b)].forEach(it => {
            if (!map.has(it.pn)) map.set(it.pn, { pn: it.pn, name: it.name, perBrand: {} });
            map.get(it.pn).perBrand[b] = it;
        });
    });

    let rows = [...map.values()].sort((a, b) => a.pn.localeCompare(b.pn));

    // 상태 판정
    rows.forEach(r => {
        const present = brands.filter(b => r.perBrand[b]);
        const specs = present.map(b => r.perBrand[b].spec + '|' + r.perBrand[b].qty);
        const allSame = new Set(specs).size === 1;
        if (present.length === brands.length && allSame) r.status = 'common';
        else if (present.length < brands.length) r.status = 'missing';
        else r.status = 'change'; // 전 기종 존재하나 수량/사양 차이
    });

    // 필터
    if (onlyDiff) rows = rows.filter(r => r.status !== 'common');
    if (q) rows = rows.filter(r => (r.pn + r.name).toLowerCase().includes(q));

    // 요약 카드
    const all = [...map.values()];
    const common = all.filter(r => {
        const present = brands.filter(b => r.perBrand[b]);
        return present.length === brands.length &&
               new Set(present.map(b => r.perBrand[b].spec + '|' + r.perBrand[b].qty)).size === 1;
    }).length;
    const missing = all.filter(r => brands.filter(b => r.perBrand[b]).length < brands.length).length;
    document.getElementById('crossSummary').innerHTML =
        summaryCard('전체 품번', all.length, 'text-gray-800 dark:text-gray-100') +
        summaryCard('전 기종 공통', common, 'text-emerald-600 dark:text-emerald-400') +
        summaryCard('수량/사양 차이', all.length - common - missing, 'text-amber-600 dark:text-amber-400') +
        summaryCard('일부 기종만', missing, 'text-rose-600 dark:text-rose-400');

    // 헤더
    document.getElementById('crossHead').innerHTML =
        `<th class="px-3 py-2 font-semibold">품번</th>
         <th class="px-3 py-2 font-semibold">품명</th>` +
        brands.map(b => `<th class="px-3 py-2 font-semibold">${b}<br><span class="text-[10px] text-gray-400 font-normal">${latestVersion(b)}</span></th>`).join('');

    // 본문
    const cellBg = { common: 'st-add', change: 'st-change', missing: 'st-remove' };
    document.getElementById('crossBody').innerHTML = rows.map(r => {
        const cells = brands.map(b => {
            const it = r.perBrand[b];
            if (!it) return `<td class="px-3 py-2 st-missing">- 미적용 -</td>`;
            return `<td class="px-3 py-2">
                        <div>${it.spec}</div>
                        <div class="text-xs text-gray-500 dark:text-gray-400">${it.qty} ${it.unit}</div>
                    </td>`;
        }).join('');
        return `<tr class="${cellBg[r.status]}">
                    <td class="px-3 py-2 font-mono text-xs">${r.pn}</td>
                    <td class="px-3 py-2 font-medium">${r.name}</td>
                    ${cells}
                </tr>`;
    }).join('') || `<tr><td colspan="9" class="px-3 py-6 text-center text-gray-400">표시할 항목이 없습니다.</td></tr>`;
}

document.querySelectorAll('.cross-brand').forEach(c => c.addEventListener('change', renderCross));
document.getElementById('onlyDiff').addEventListener('change', renderCross);
document.getElementById('crossSearch').addEventListener('input', renderCross);

/*****************************************************************************
 * 4) 버전 간 비교 (동일 기종의 두 버전 BOM diff)

function fillVersionSelectors() {
    const brand = document.getElementById('verBrand').value;
    const versions = Object.keys(BOM[brand]);
    const from = document.getElementById('verFrom');
    const to = document.getElementById('verTo');
    from.innerHTML = versions.map(v => `<option>${v}</option>`).join('');
    to.innerHTML = versions.map(v => `<option>${v}</option>`).join('');
    from.value = versions[Math.max(0, versions.length - 2)];
    to.value = versions[versions.length - 1];
}

function renderVersion() {
    const brand = document.getElementById('verBrand').value;
    const vf = document.getElementById('verFrom').value;
    const vt = document.getElementById('verTo').value;
    const from = new Map(BOM[brand][vf].map(i => [i.pn, i]));
    const to = new Map(BOM[brand][vt].map(i => [i.pn, i]));
    const allPns = new Set([...from.keys(), ...to.keys()]);

    const rows = [...allPns].sort().map(pn => {
        const a = from.get(pn), b = to.get(pn);
        let status, item = b || a;
        if (a && !b) status = 'remove';
        else if (!a && b) status = 'add';
        else if (a.spec !== b.spec || a.qty !== b.qty) status = 'change';
        else status = 'same';
        return { pn, status, item, qFrom: a?.qty ?? '', qTo: b?.qty ?? '' };
    });

    const cnt = s => rows.filter(r => r.status === s).length;
    document.getElementById('verSummary').innerHTML =
        summaryCard('동일', cnt('same'), 'text-gray-800 dark:text-gray-100') +
        summaryCard('추가', cnt('add'), 'text-emerald-600 dark:text-emerald-400') +
        summaryCard('삭제', cnt('remove'), 'text-rose-600 dark:text-rose-400') +
        summaryCard('변경', cnt('change'), 'text-amber-600 dark:text-amber-400');

    const badge = {
        same:   '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-600">동일</span>',
        add:    '<span class="text-xs px-2 py-0.5 rounded-full bg-emerald-200 text-emerald-800 dark:bg-emerald-800 dark:text-emerald-100">추가</span>',
        remove: '<span class="text-xs px-2 py-0.5 rounded-full bg-rose-200 text-rose-800 dark:bg-rose-800 dark:text-rose-100">삭제</span>',
        change: '<span class="text-xs px-2 py-0.5 rounded-full bg-amber-200 text-amber-800 dark:bg-amber-800 dark:text-amber-100">변경</span>',
    };
    const rowBg = { add: 'st-add', remove: 'st-remove', change: 'st-change', same: '' };

    document.getElementById('verBody').innerHTML = rows.map(r => {
        const qtyChanged = r.status === 'change' && r.qFrom !== r.qTo;
        return `<tr class="${rowBg[r.status]}">
            <td class="px-3 py-2">${badge[r.status]}</td>
            <td class="px-3 py-2 font-mono text-xs">${r.pn}</td>
            <td class="px-3 py-2 font-medium">${r.item.name}</td>
            <td class="px-3 py-2">${r.item.spec}</td>
            <td class="px-3 py-2 text-right ${r.status==='add'?'st-missing':''}">${r.qFrom}</td>
            <td class="px-3 py-2 text-right ${qtyChanged?'font-bold text-amber-600 dark:text-amber-400':''} ${r.status==='remove'?'st-missing':''}">${r.qTo}</td>
        </tr>`;
    }).join('');
}

document.getElementById('verBrand').addEventListener('change', () => { fillVersionSelectors(); renderVersion(); });
document.getElementById('verRun').addEventListener('click', renderVersion);
document.getElementById('verFrom').addEventListener('change', renderVersion);
document.getElementById('verTo').addEventListener('change', renderVersion);

/*****************************************************************************
 * 5) 초기 렌더
 *****************************************************************************/
renderCross();
fillVersionSelectors();
renderVersion();
</script>
</body>
</html>
