<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엘리베이터 정보 조회</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Handsontable CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable@14.3.0/dist/handsontable.full.min.js"></script>

    <style>
        body { font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }
        .handsontable {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            font-size: 13px;
        }
        .base-info-col { background-color: #f9fafb !important; }
        .part-col { background-color: #fef3c7 !important; }  /* 부품 컬럼 - 연한 노랑 */
        .pid-col  { background-color: #dbeafe !important; }  /* PID 컬럼 - 연한 파랑 */
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-full mx-auto p-6">
    <!-- 헤더 -->
    <div class="mb-4">
        <h1 class="text-2xl font-bold text-gray-800">엘리베이터 정보 조회</h1>
        <p class="text-sm text-gray-500 mt-1">기본 정보를 조회한 후, 부품/PID 정보를 추가 조회하여 같은 행의 열에 데이터를 추가합니다.</p>
    </div>

    <!-- 기본 검색조건 영역 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold text-gray-700 border-l-4 border-blue-500 pl-2">기본 검색 조건</h2>
            <button id="btnAddBaseCondition"
                    class="px-3 py-1 bg-blue-50 border border-blue-300 text-blue-700 text-xs rounded hover:bg-blue-100">
                + 조건 추가
            </button>
        </div>
        <div id="baseConditionContainer" class="space-y-2"></div>
        <div class="flex justify-end mt-4 gap-2">
            <button id="btnReset"
                    class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm rounded hover:bg-gray-50">
                초기화
            </button>
            <button id="btnSearch"
                    class="px-5 py-2 bg-blue-600 text-white text-sm rounded hover:bg-blue-700 font-medium">
                조회
            </button>
        </div>
    </div>

    <!-- 추가 정보 검색조건 영역 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 mb-4">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold text-gray-700 border-l-4 border-green-500 pl-2">
                추가 정보 검색 조건
                <span class="text-xs font-normal text-gray-500 ml-2">
                        (입력한 BLOCKNO / PID명이 헤더가 되어 표 우측에 컬럼이 추가됩니다)
                    </span>
            </h2>
            <button id="btnAddExtraCondition"
                    class="px-3 py-1 bg-green-50 border border-green-300 text-green-700 text-xs rounded hover:bg-green-100">
                + 조건 추가
            </button>
        </div>
        <div id="extraConditionContainer" class="space-y-2"></div>
        <div class="flex justify-between items-center mt-4">
            <div class="text-xs text-gray-500">
                ※ 좌측 표에서 행을 선택하면 해당 행에만 적용되며, 선택 없을 시 전체 행에 적용됩니다.<br>
                ※ 부품 조회: BLOCKNO에 해당하는 부품 값을 조회합니다.<br>
                ※ PID 조회: PID명에 해당하는 값을 조회하며, RESULT값 입력 시 해당 값과 일치하는 경우만 표시됩니다.
            </div>
            <div class="flex gap-2">
                <button id="btnExtraReset"
                        class="px-4 py-2 bg-white border border-gray-300 text-gray-700 text-sm rounded hover:bg-gray-50">
                    조건 초기화
                </button>
                <button id="btnExtraSearch"
                        class="px-5 py-2 bg-green-600 text-white text-sm rounded hover:bg-green-700 font-medium">
                    추가 정보 조회
                </button>
            </div>
        </div>
    </div>

    <!-- 조회 결과 영역 -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold text-gray-700 border-l-4 border-gray-500 pl-2">
                조회 결과 <span id="resultCount" class="text-xs font-normal text-gray-500 ml-1">(0건)</span>
            </h2>
            <div class="flex gap-2">
                <button id="btnExport"
                        class="px-3 py-1.5 bg-white border border-gray-300 text-gray-700 text-xs rounded hover:bg-gray-50">
                    CSV 내보내기
                </button>
            </div>
        </div>
        <div id="resultTable" class="border border-gray-200"></div>
    </div>
</div>

<script>
    /* ========================================================
     * [기본 검색 조건] 연산자 정의 - 기존과 동일
     * ======================================================== */
    const operatorDef = {
        eq:          { label: '같음',       inputCount: 1 },
        ne:          { label: '같지 않음',   inputCount: 1 },
        contains:    { label: '포함',       inputCount: 1 },
        notContains: { label: '미포함',     inputCount: 1 },
        startsWith:  { label: '시작',       inputCount: 1 },
        endsWith:    { label: '끝',         inputCount: 1 },
        gt:          { label: '초과 (>)',   inputCount: 1 },
        gte:         { label: '이상 (≥)',   inputCount: 1 },
        lt:          { label: '미만 (<)',   inputCount: 1 },
        lte:         { label: '이하 (≤)',   inputCount: 1 },
        between:     { label: '범위',       inputCount: 2 },
        notBetween:  { label: '범위 외',     inputCount: 2 },
        isEmpty:     { label: '값 없음',     inputCount: 0 },
        isNotEmpty:  { label: '값 있음',     inputCount: 0 }
    };

    const operatorsByType = {
        text:   ['contains', 'notContains', 'eq', 'ne', 'startsWith', 'endsWith', 'isEmpty', 'isNotEmpty'],
        select: ['eq', 'ne', 'isEmpty', 'isNotEmpty'],
        date:   ['eq', 'ne', 'gt', 'gte', 'lt', 'lte', 'between', 'notBetween', 'isEmpty', 'isNotEmpty'],
        number: ['eq', 'ne', 'gt', 'gte', 'lt', 'lte', 'between', 'notBetween', 'isEmpty', 'isNotEmpty']
    };

    const baseFieldDef = {
        codeVal: { label: '코드',     type: 'text',   placeholder: '예: 강남빌딩' },
        buildingName: { label: '건물명',     type: 'text',   placeholder: '예: 강남빌딩' },
        unitNo:       { label: '호기',       type: 'text',   placeholder: '예: 1호기' },
        ASPSCD:       { label: '생산거점',   type: 'select', options: ['KC01', 'KC02', 'KR00', 'GAL', 'HD'] },
        ATYP:       { label: '기종',   type: 'select', options: ['GTLX', 'GTLX_E','GTLX_R','GTLX','GTSS','GTSS_E','GTSS_R',
                'SSVF','WBSS','WBLX','LXVF','SUVF','WBST'] },
        status:       { label: '상태',       type: 'select', options: ['운행중', '점검중', '고장'] },
        manufacturer: { label: '용도',     type: 'select', options: ['PS','HC','EP','EH','OB','OH','BD','ND','BH','NH','HF','RS','RH','PI'] },
        ETHRU : {label: '관통', type: 'text', placeholder : 'Y, N'},
        ETM:        { label: '권상기',     type: 'text',   placeholder: '예: GA75C' },
        ETMD:        { label: 'TM;방향',     type: 'text',   placeholder: '예: GA75C' },
        ACAPA:        { label: '용량',     type: 'text',   placeholder: '예: GA75C' },
        AOPEN:        { label: '열림',     type: 'text',   placeholder: '예: GA75C' },
        ASPC:        { label: '시방서',     type: 'text',   placeholder: '예: GA75C' },
        ASPD:        { label: '속도',     type: 'text',   placeholder: '예: GA75C' },
        DEHL:        { label: '승강로사다리',     type: 'text',   placeholder: '예: GA75C' },
        ECRL:        { label: 'CAR RAIL',     type: 'text',   placeholder: '예: GA75C' },
        ECWTP:        { label: 'CWT위치',     type: 'text',   placeholder: '예: GA75C' },
        ERPD:        { label: 'ROPE/BELT직경',     type: 'text',   placeholder: '예: GA75C' },
        ERPR:        { label: 'ROPE/BELT;ROPING',     type: 'text',   placeholder: '예: GA75C' },
        ERPW:        { label: 'ROPE본수',     type: 'text',   placeholder: '예: GA75C' },
        ECWTP:        { label: 'CWT위치',     type: 'text',   placeholder: '예: GA75C' },
        installDate:  { label: '설치일',     type: 'date' },
        capacity:     { label: '정원(인승)', type: 'number' }
    };

    /* ========================================================
     * [기본 표 컬럼]
     * ======================================================== */
    const baseColumns = [
        { data: 'no',          title: 'No',         width: 50,  readOnly: true, className: 'htCenter base-info-col' },
        { data: 'buildingName',title: '건물명',      width: 150, readOnly: true, className: 'base-info-col' },
        { data: 'unitNo',      title: '호기',        width: 80,  readOnly: true, className: 'htCenter base-info-col' },
        { data: 'model',       title: '모델명',      width: 140, readOnly: true, className: 'base-info-col' },
        { data: 'manufacturer',title: '제조사',      width: 110, readOnly: true, className: 'base-info-col' },
        { data: 'installDate', title: '설치일',      width: 110, readOnly: true, className: 'htCenter base-info-col' },
        { data: 'capacity',    title: '정원(인승)',  width: 90,  readOnly: true, className: 'htRight base-info-col' },
        { data: 'floors',      title: '운행 층',     width: 90,  readOnly: true, className: 'htCenter base-info-col' },
        { data: 'region',      title: '지역',        width: 80,  readOnly: true, className: 'htCenter base-info-col' },
        { data: 'status',      title: '상태',        width: 80,  readOnly: true, className: 'htCenter base-info-col' }
    ];

    let currentColumns = [...baseColumns];
    // 추가된 컬럼 추적 - key는 'part:BLOCKNO값' 또는 'pid:PID명' 형태
    const addedExtraCols = new Set();
    let hot = null;
    let currentData = [];
    let conditionUidCounter = 0;

    /* ========================================================
     * Handsontable 초기화
     * ======================================================== */
    function initTable() {
        const container = document.getElementById('resultTable');
        hot = new Handsontable(container, {
            data: [],
            columns: currentColumns,
            colHeaders: currentColumns.map(c => c.title),
            rowHeaders: true,
            width: '100%',
            height: 500,
            stretchH: 'none',
            manualColumnResize: true,
            manualRowResize: true,
            contextMenu: true,
            filters: true,
            dropdownMenu: true,
            columnSorting: true,
            selectionMode: 'multiple',
            fixedColumnsStart: 3,
            licenseKey: 'non-commercial-and-evaluation'
        });
    }

    function rebuildColumns() {
        hot.updateSettings({
            columns: currentColumns,
            colHeaders: currentColumns.map(c => c.title)
        });
    }

    /* ========================================================
     * [기본 검색 조건] 조건 행 생성 - 기존과 동일
     * ======================================================== */
    function createBaseConditionRow() {
        const uid = `cond_base_${++conditionUidCounter}`;
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 condition-row';
        row.dataset.uid = uid;

        const fieldSelect = document.createElement('select');
        fieldSelect.className = 'field-select w-40 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400';
        fieldSelect.innerHTML = '<option value="">-- 항목 선택 --</option>' +
            Object.entries(baseFieldDef).map(([key, def]) =>
                `<option value="${key}">${def.label}</option>`
            ).join('');
        row.appendChild(fieldSelect);

        const opSelect = document.createElement('select');
        opSelect.className = 'op-select w-32 px-2 py-1.5 border border-gray-300 rounded text-sm bg-gray-50 focus:outline-none focus:ring-1 focus:ring-blue-400';
        opSelect.disabled = true;
        opSelect.innerHTML = '<option value="">연산자</option>';
        row.appendChild(opSelect);

        const valueWrap = document.createElement('div');
        valueWrap.className = 'value-wrap flex-1 flex items-center gap-2';
        row.appendChild(valueWrap);

        const removeBtn = document.createElement('button');
        removeBtn.className = 'px-2 py-1 bg-white border border-red-300 text-red-600 text-xs rounded hover:bg-red-50';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => row.remove());
        row.appendChild(removeBtn);

        fieldSelect.addEventListener('change', () => {
            const fieldKey = fieldSelect.value;
            valueWrap.innerHTML = '';
            if (!fieldKey) {
                opSelect.innerHTML = '<option value="">연산자</option>';
                opSelect.disabled = true;
                return;
            }
            const def = baseFieldDef[fieldKey];
            const opList = operatorsByType[def.type] || [];
            const defaultOp = def.type === 'text' ? 'contains' : 'eq';

            opSelect.disabled = false;
            opSelect.className = 'op-select w-32 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400';
            opSelect.innerHTML = opList.map(op =>
                `<option value="${op}" ${op === defaultOp ? 'selected' : ''}>${operatorDef[op].label}</option>`
            ).join('');
            renderBaseValueInput(valueWrap, def, opSelect.value);
        });

        opSelect.addEventListener('change', () => {
            const fieldKey = fieldSelect.value;
            if (!fieldKey) return;
            const def = baseFieldDef[fieldKey];
            valueWrap.innerHTML = '';
            renderBaseValueInput(valueWrap, def, opSelect.value);
        });

        document.getElementById('baseConditionContainer').appendChild(row);
    }

    function renderBaseValueInput(wrap, def, op) {
        const opInfo = operatorDef[op];
        if (!opInfo) return;
        const count = opInfo.inputCount;
        if (count === 0) {
            const note = document.createElement('span');
            note.className = 'text-xs text-gray-500';
            note.textContent = '(값 입력 불필요)';
            wrap.appendChild(note);
            return;
        }
        const makeInput = (role, placeholder) => {
            let el;
            switch (def.type) {
                case 'text':
                    el = document.createElement('input');
                    el.type = 'text';
                    el.placeholder = placeholder ?? (def.placeholder || '');
                    break;
                case 'select':
                    el = document.createElement('select');
                    el.innerHTML = '<option value="">선택</option>' +
                        def.options.map(o => `<option value="${o}">${o}</option>`).join('');
                    break;
                case 'date':
                    el = document.createElement('input');
                    el.type = 'date';
                    break;
                case 'number':
                    el = document.createElement('input');
                    el.type = 'number';
                    el.placeholder = placeholder ?? '';
                    break;
            }
            el.className = 'val-input flex-1 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-400';
            el.dataset.role = role;
            return el;
        };
        if (count === 1) {
            wrap.appendChild(makeInput('value'));
        } else if (count === 2) {
            wrap.appendChild(makeInput('from', '시작'));
            const sep = document.createElement('span');
            sep.className = 'text-gray-500 text-sm';
            sep.textContent = '~';
            wrap.appendChild(sep);
            wrap.appendChild(makeInput('to', '끝'));
        }
    }

    function extractBaseConditions() {
        const conditions = [];
        document.querySelectorAll('#baseConditionContainer .condition-row').forEach(row => {
            const fieldKey = row.querySelector('.field-select')?.value;
            const op = row.querySelector('.op-select')?.value;
            if (!fieldKey || !op) return;
            const def = baseFieldDef[fieldKey];
            const opInfo = operatorDef[op];
            const cond = { field: fieldKey, op, type: def.type };
            if (opInfo.inputCount === 1) {
                const v = row.querySelector('[data-role="value"]')?.value ?? '';
                if (v === '') return;
                cond.value = v;
            } else if (opInfo.inputCount === 2) {
                const from = row.querySelector('[data-role="from"]')?.value ?? '';
                const to   = row.querySelector('[data-role="to"]')?.value ?? '';
                if (from === '' || to === '') return;
                cond.from = from;
                cond.to = to;
            }
            conditions.push(cond);
        });
        return conditions;
    }

    function applyOperator(rawValue, cond) {
        const { op, type } = cond;
        const isEmpty = rawValue === undefined || rawValue === null || rawValue === '';
        if (op === 'isEmpty')    return isEmpty;
        if (op === 'isNotEmpty') return !isEmpty;
        if (isEmpty) return false;
        if (type === 'number') {
            const v = Number(rawValue);
            if (op === 'between')    return v >= Number(cond.from) && v <= Number(cond.to);
            if (op === 'notBetween') return !(v >= Number(cond.from) && v <= Number(cond.to));
            const cv = Number(cond.value);
            switch (op) {
                case 'eq':  return v === cv;
                case 'ne':  return v !== cv;
                case 'gt':  return v >  cv;
                case 'gte': return v >= cv;
                case 'lt':  return v <  cv;
                case 'lte': return v <= cv;
            }
        } else if (type === 'date') {
            const v = String(rawValue);
            if (op === 'between')    return v >= cond.from && v <= cond.to;
            if (op === 'notBetween') return !(v >= cond.from && v <= cond.to);
            switch (op) {
                case 'eq':  return v === cond.value;
                case 'ne':  return v !== cond.value;
                case 'gt':  return v >  cond.value;
                case 'gte': return v >= cond.value;
                case 'lt':  return v <  cond.value;
                case 'lte': return v <= cond.value;
            }
        } else {
            const v = String(rawValue);
            const cv = String(cond.value);
            switch (op) {
                case 'eq':          return v === cv;
                case 'ne':          return v !== cv;
                case 'contains':    return v.includes(cv);
                case 'notContains': return !v.includes(cv);
                case 'startsWith':  return v.startsWith(cv);
                case 'endsWith':    return v.endsWith(cv);
            }
        }
        return true;
    }

    /* ========================================================
     * ★ [추가 정보 검색 조건] 부품 / PID 조회 ★
     * ======================================================== */
    const extraTypeDef = {
        part: { label: '부품' },
        pid:  { label: 'PID' }
    };

    /**
     * 추가 정보 검색 조건 행 생성
     * - 부품 선택: [구분 ▼] [BLOCKNO 입력] [✕]
     * - PID 선택:  [구분 ▼] [PID명 입력] [RESULT값 입력] [✕]
     */
    function createExtraConditionRow() {
        const uid = `cond_extra_${++conditionUidCounter}`;
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 condition-row';
        row.dataset.uid = uid;

        // 1) 구분 셀렉트박스 (부품 / PID)
        const typeSelect = document.createElement('select');
        typeSelect.className = 'extra-type-select w-32 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-green-400';
        typeSelect.innerHTML = '<option value="">-- 구분 --</option>' +
            Object.entries(extraTypeDef).map(([k, v]) =>
                `<option value="${k}">${v.label}</option>`
            ).join('');
        row.appendChild(typeSelect);

        // 2) 입력 영역 (구분에 따라 동적 생성)
        const inputWrap = document.createElement('div');
        inputWrap.className = 'extra-input-wrap flex-1 flex items-center gap-2';
        row.appendChild(inputWrap);

        // 3) 삭제 버튼
        const removeBtn = document.createElement('button');
        removeBtn.className = 'px-2 py-1 bg-white border border-red-300 text-red-600 text-xs rounded hover:bg-red-50';
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => row.remove());
        row.appendChild(removeBtn);

        // 구분 변경 시 입력 영역 갱신
        typeSelect.addEventListener('change', () => {
            inputWrap.innerHTML = '';
            const t = typeSelect.value;
            if (t === 'part') {
                // BLOCKNO 입력만
                const blockno = document.createElement('input');
                blockno.type = 'text';
                blockno.placeholder = 'BLOCKNO 입력 (예: B-1001)';
                blockno.className = 'val-input flex-1 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-green-400';
                blockno.dataset.role = 'blockno';
                inputWrap.appendChild(blockno);
            } else if (t === 'pid') {
                // PID명 + RESULT값
                const pidName = document.createElement('input');
                pidName.type = 'text';
                pidName.placeholder = 'PID명 입력 (예: TEMP_01)';
                pidName.className = 'val-input flex-1 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-green-400';
                pidName.dataset.role = 'pidName';
                inputWrap.appendChild(pidName);

                const sep = document.createElement('span');
                sep.className = 'text-gray-500 text-sm';
                sep.textContent = '=';
                inputWrap.appendChild(sep);

                const resultVal = document.createElement('input');
                resultVal.type = 'text';
                resultVal.placeholder = 'RESULT값 (선택, 미입력 시 전체)';
                resultVal.className = 'val-input flex-1 px-2 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:ring-1 focus:ring-green-400';
                resultVal.dataset.role = 'resultVal';
                inputWrap.appendChild(resultVal);
            }
        });

        document.getElementById('extraConditionContainer').appendChild(row);
    }

    /**
     * 추가 정보 검색 조건들을 배열로 추출
     * 반환 형태:
     *   [
     *     { type: 'part', blockno: 'B-1001' },
     *     { type: 'pid',  pidName: 'TEMP_01', resultVal: '정상' }
     *   ]
     */
    function extractExtraConditions() {
        const conditions = [];
        document.querySelectorAll('#extraConditionContainer .condition-row').forEach(row => {
            const t = row.querySelector('.extra-type-select')?.value;
            if (!t) return;
            if (t === 'part') {
                const blockno = row.querySelector('[data-role="blockno"]')?.value.trim() ?? '';
                if (blockno === '') return;
                conditions.push({ type: 'part', blockno });
            } else if (t === 'pid') {
                const pidName = row.querySelector('[data-role="pidName"]')?.value.trim() ?? '';
                const resultVal = row.querySelector('[data-role="resultVal"]')?.value.trim() ?? '';
                if (pidName === '') return;
                conditions.push({ type: 'pid', pidName, resultVal });
            }
        });
        return conditions;
    }

    /* ========================================================
     * 기본 조회 데이터 (Mock - 실제 API로 대체)
     * ======================================================== */
    function fetchBaseData(conditions) {
        const allData = [
            { no: 1, buildingName: '강남빌딩',   unitNo: '1호기', model: 'HVS-2000',  manufacturer: '현대엘리베이터', installDate: '2015-03-12', capacity: 15, floors: 'B2-20F', region: '서울', status: '운행중' },
            { no: 2, buildingName: '강남빌딩',   unitNo: '2호기', model: 'HVS-2000',  manufacturer: '현대엘리베이터', installDate: '2015-03-12', capacity: 15, floors: 'B2-20F', region: '서울', status: '운행중' },
            { no: 3, buildingName: '판교타워',   unitNo: '1호기', model: 'OTIS-Gen2', manufacturer: 'OTIS',           installDate: '2018-08-25', capacity: 20, floors: 'B3-25F', region: '경기', status: '운행중' },
            { no: 4, buildingName: '판교타워',   unitNo: '2호기', model: 'OTIS-Gen2', manufacturer: 'OTIS',           installDate: '2018-08-25', capacity: 20, floors: 'B3-25F', region: '경기', status: '점검중' },
            { no: 5, buildingName: '인천스퀘어', unitNo: '1호기', model: 'TK-Synergy', manufacturer: '티센크루프',    installDate: '2020-11-03', capacity: 13, floors: '1-15F',  region: '인천', status: '운행중' },
            { no: 6, buildingName: '충주센터',   unitNo: '1호기', model: 'MS-Premier',manufacturer: '미쓰비시',        installDate: '2019-06-18', capacity: 17, floors: 'B1-18F', region: '충북', status: '고장'   },
            { no: 7, buildingName: '충주센터',   unitNo: '2호기', model: 'MS-Premier',manufacturer: '미쓰비시',        installDate: '2019-06-18', capacity: 17, floors: 'B1-18F', region: '충북', status: '운행중' }
        ];
        return allData.filter(row =>
            conditions.every(cond => applyOperator(row[cond.field], cond))
        );
    }

    /* ========================================================
     * 부품 조회 Mock 데이터
     *   { 엘리베이터 no: { BLOCKNO: 부품정보 } }
     * ======================================================== */
    const mockPartData = {
        1: { 'B-1001': '도어모터-DM200', 'B-1002': '와이어로프-WR8',  'B-2001': '제어보드-CB100' },
        2: { 'B-1001': '도어모터-DM200', 'B-1002': '와이어로프-WR8',  'B-2001': '제어보드-CB100' },
        3: { 'B-1001': '도어모터-DM350', 'B-1002': '와이어로프-WR10', 'B-2001': '제어보드-CB200' },
        4: { 'B-1001': '도어모터-DM350', 'B-1002': '와이어로프-WR10', 'B-2001': '제어보드-CB200' },
        5: { 'B-1001': '도어모터-TK100', 'B-1002': '와이어로프-WR8',  'B-2001': '제어보드-CB150' },
        6: { 'B-1001': '도어모터-MS50',  'B-1002': '와이어로프-WR9',  'B-2001': '제어보드-CB180' },
        7: { 'B-1001': '도어모터-MS50',  'B-1002': '와이어로프-WR9',  'B-2001': '제어보드-CB180' }
    };

    /* ========================================================
     * PID 조회 Mock 데이터
     *   { 엘리베이터 no: { PID명: 측정값 } }
     * ======================================================== */
    const mockPidData = {
        1: { 'TEMP_01': '정상', 'SPEED_01': '1.0m/s', 'VIB_01': '0.12' },
        2: { 'TEMP_01': '정상', 'SPEED_01': '1.0m/s', 'VIB_01': '0.15' },
        3: { 'TEMP_01': '정상', 'SPEED_01': '1.5m/s', 'VIB_01': '0.08' },
        4: { 'TEMP_01': '경고', 'SPEED_01': '1.5m/s', 'VIB_01': '0.25' },
        5: { 'TEMP_01': '정상', 'SPEED_01': '1.0m/s', 'VIB_01': '0.10' },
        6: { 'TEMP_01': '경고', 'SPEED_01': '0.0m/s', 'VIB_01': '0.45' },
        7: { 'TEMP_01': '정상', 'SPEED_01': '1.2m/s', 'VIB_01': '0.14' }
    };

    /**
     * 부품 정보 조회: BLOCKNO에 대한 부품 정보 반환
     */
    function fetchPartValue(rowNo, blockno) {
        return mockPartData[rowNo]?.[blockno] ?? '';
    }

    /**
     * PID 정보 조회: PID명에 대한 측정값 반환
     *  - resultVal이 입력된 경우: 측정값과 일치하면 값 반환, 아니면 빈 문자열
     *  - resultVal이 빈 경우: 측정값 그대로 반환
     */
    function fetchPidValue(rowNo, pidName, resultVal) {
        const v = mockPidData[rowNo]?.[pidName];
        if (v === undefined || v === null) return '';
        if (resultVal !== '' && String(v) !== String(resultVal)) return '';
        return v;
    }

    /* ========================================================
     * 이벤트 - 조건 추가 버튼
     * ======================================================== */
    document.getElementById('btnAddBaseCondition').addEventListener('click', createBaseConditionRow);
    document.getElementById('btnAddExtraCondition').addEventListener('click', createExtraConditionRow);

    /* ========================================================
     * 이벤트 - 기본 조회
     * ======================================================== */
    document.getElementById('btnSearch').addEventListener('click', () => {
        const conditions = extractBaseConditions();
        currentData = fetchBaseData(conditions);

        currentColumns = [...baseColumns];
        addedExtraCols.clear();
        rebuildColumns();

        hot.loadData(currentData);
        document.getElementById('resultCount').textContent = `(${currentData.length}건)`;
    });

    /* ========================================================
     * 이벤트 - 기본조건 초기화
     * ======================================================== */
    document.getElementById('btnReset').addEventListener('click', () => {
        document.getElementById('baseConditionContainer').innerHTML = '';
        createBaseConditionRow();
    });

    /* ========================================================
     * 이벤트 - 추가 정보 조회
     *   사용자가 입력한 BLOCKNO 또는 PID명을 헤더로 하는
     *   컬럼이 표 우측에 추가되고, 각 행에 해당 값이 채워진다.
     * ======================================================== */
    document.getElementById('btnExtraSearch').addEventListener('click', () => {
        if (currentData.length === 0) {
            alert('먼저 기본 조회를 실행해주세요.');
            return;
        }
        const conditions = extractExtraConditions();
        if (conditions.length === 0) {
            alert('조회할 항목을 하나 이상 추가해주세요.\n(부품: BLOCKNO 입력 / PID: PID명 입력)');
            return;
        }

        // 선택된 행 (없으면 전체)
        const selected = hot.getSelected();
        let targetRows = [];
        if (selected && selected.length > 0) {
            const rowSet = new Set();
            selected.forEach(range => {
                const [r1, , r2] = range;
                const from = Math.min(r1, r2);
                const to   = Math.max(r1, r2);
                for (let r = from; r <= to; r++) rowSet.add(r);
            });
            targetRows = [...rowSet];
        } else {
            targetRows = currentData.map((_, idx) => idx);
        }

        // 각 조건마다 컬럼을 추가하고, 해당 컬럼에 값 채움
        const allChanges = [];
        let columnsAdded = false;

        conditions.forEach(cond => {
            // 컬럼 식별 키와 컬럼 정의
            let colKey, colTitle, colClass;
            if (cond.type === 'part') {
                colKey   = `part__${cond.blockno}`;
                colTitle = cond.blockno;                 // 사용자 입력 BLOCKNO가 헤더
                colClass = 'htCenter part-col';
            } else { // pid
                colKey   = `pid__${cond.pidName}`;
                colTitle = cond.pidName;                 // 사용자 입력 PID명이 헤더
                colClass = 'htCenter pid-col';
            }

            // 이미 같은 컬럼이 추가되어 있지 않으면 추가
            if (!addedExtraCols.has(colKey)) {
                currentColumns.push({
                    data: colKey,
                    title: colTitle,
                    width: 130,
                    readOnly: true,
                    className: colClass
                });
                addedExtraCols.add(colKey);
                columnsAdded = true;
            }

            // 각 대상 행에 값 채움
            targetRows.forEach(rowIdx => {
                const rowData = hot.getSourceDataAtRow(rowIdx);
                if (!rowData) return;
                let v = '';
                if (cond.type === 'part') {
                    v = fetchPartValue(rowData.no, cond.blockno);
                } else {
                    v = fetchPidValue(rowData.no, cond.pidName, cond.resultVal);
                }
                allChanges.push([rowIdx, colKey, v]);
            });
        });

        if (columnsAdded) rebuildColumns();
        if (allChanges.length > 0) hot.setDataAtRowProp(allChanges);
    });

    /* ========================================================
     * 이벤트 - 추가조건 초기화
     * ======================================================== */
    document.getElementById('btnExtraReset').addEventListener('click', () => {
        document.getElementById('extraConditionContainer').innerHTML = '';
        createExtraConditionRow();
    });

    /* ========================================================
     * CSV 내보내기
     * ======================================================== */
    document.getElementById('btnExport').addEventListener('click', () => {
        if (!hot || currentData.length === 0) {
            alert('내보낼 데이터가 없습니다.');
            return;
        }
        const headers = currentColumns.map(c => c.title);
        const keys = currentColumns.map(c => c.data);
        const rows = [];
        for (let i = 0; i < hot.countRows(); i++) {
            const r = hot.getSourceDataAtRow(i);
            rows.push(keys.map(k => r[k] ?? ''));
        }
        const csv = [headers, ...rows]
            .map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
            .join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `엘리베이터_조회결과_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    });

    /* ========================================================
     * 초기 실행
     * ======================================================== */
    initTable();
    createBaseConditionRow();
    createExtraConditionRow();
</script>
