<!doctype html>
<html lang="ko" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLM 유관 부품 검색</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- vis-network (관계도) -->
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/dist/vis-network.min.css" rel="stylesheet"/>

    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Nanum Gothic", "Malgun Gothic", sans-serif; }
        #graph { width: 100%; height: 520px; border: 1px solid var(--bs-border-color); border-radius: 0.75rem; background: var(--bs-body-bg); }
        .sidebar { max-height: 520px; overflow: auto; }
        .muted-badge { font-weight: 500; letter-spacing: .02em; }
        .node-pill { font-size: .85rem; }
        .toolbar .btn { white-space: nowrap; }
        .list-group-item small { color: var(--bs-secondary-color); }
        .kbd { border:1px solid var(--bs-border-color); border-bottom-width:2px; padding:.1rem .3rem; border-radius:.25rem; font-size:.75rem;}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom bg-body">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="#">🔎 유관 부품 검색</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="d-none d-md-inline small text-secondary">Ctrl+휠 확대 · 드래그 이동</span>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="themeToggle">
                <label class="form-check-label" for="themeToggle">다크모드</label>
            </div>
        </div>
    </div>
</nav>

<main class="container-xxl py-4">
    <!-- 검색 영역 -->
    <div class="card mb-3">
        <div class="card-body">
            <form id="searchForm" class="row g-2 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="inputPart" class="form-label mb-1">자재번호</label>
                    <input type="text" class="form-control" id="inputPart" placeholder="예: 1234-ABCD" required>
                </div>

                <div class="col-6 col-md-2">
                    <label class="form-label mb-1" for="depthSelect">연관 깊이</label>
                    <select id="depthSelect" class="form-select">
                        <option value="1" selected>1 단계</option>
                        <option value="2">2 단계</option>
                        <option value="3">3 단계</option>
                    </select>
                </div>

                <div class="col-6 col-md-3">
                    <label class="form-label mb-1" for="relationType">관계 유형</label>
                    <select id="relationType" class="form-select">
                        <option value="co-usage" selected>동시사용(Co-usage)</option>
                        <option value="bom-parent">상위(BOM Parent)</option>
                        <option value="bom-child">하위(BOM Child)</option>
                    </select>
                </div>

                <div class="col-12 col-md-3 d-flex gap-2">
                    <button class="btn btn-primary flex-grow-1" type="submit">검색</button>
                    <button class="btn btn-outline-secondary" type="button" id="resetBtn">초기화</button>
                </div>
            </form>

            <div class="mt-2 d-flex gap-2 flex-wrap">
                <span class="badge text-bg-light muted-badge">엔진: JavaScript / Bootstrap</span>
                <span class="badge text-bg-light muted-badge">Graph: vis-network</span>
                <span class="badge text-bg-light muted-badge">샘플 데이터 자동 표시</span>
            </div>
        </div>
    </div>

    <!-- 결과 영역 -->
    <div class="row g-3">
        <!-- 좌: 그래프 -->
        <div class="col-12 col-lg-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div class="fw-semibold">관계도</div>
                    <div class="toolbar d-flex gap-2">
                        <button id="fitBtn" class="btn btn-sm btn-outline-secondary">맞춤 보기</button>
                        <button id="exportPngBtn" class="btn btn-sm btn-outline-secondary">PNG 저장</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="graph"></div>
                    <div class="small text-secondary mt-2">
                        단축키: <span class="kbd">F</span> 맞춤보기 · <span class="kbd">R</span> 재배치(물리) · <span class="kbd">Esc</span> 선택해제
                    </div>
                </div>
            </div>
        </div>

        <!-- 우: 리스트 & 상세 -->
        <div class="col-12 col-lg-4">
            <div class="card mb-3 sidebar">
                <div class="card-header fw-semibold">연관 부품 리스트</div>
                <div class="list-group list-group-flush" id="assocList"></div>
            </div>

            <div class="card sidebar">
                <div class="card-header fw-semibold d-flex justify-content-between align-items-center">
                    <span>상세 정보</span>
                    <span class="badge rounded-pill text-bg-secondary node-pill" id="detailNodePill" hidden>—</span>
                </div>
                <div class="card-body" id="detailPane">
                    <div class="text-secondary">노드 혹은 리스트 항목을 선택해주세요.</div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="liveToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg">오류가 발생했습니다.</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ===================== 테마 토글 =====================
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('change', () => {
        document.documentElement.setAttribute('data-bs-theme', themeToggle.checked ? 'dark' : 'light');
    });

    // ===================== vis-network 초기화 =====================
    const container = document.getElementById('graph');
    const nodes = new vis.DataSet([]);
    const edges = new vis.DataSet([]);
    const options = {
        physics: { stabilization: true, barnesHut: { gravitationalConstant: -28000, springLength: 160, damping: 0.25 } },
        nodes: {
            shape: "dot",
            size: 18,
            font: { multi: "md", face: "system-ui" },
            borderWidth: 1
        },
        edges: {
            arrows: { to: { enabled: false } },
            smooth: { type: "dynamic" }
        },
        interaction: { hover: true, multiselect: false }
    };
    const network = new vis.Network(container, { nodes, edges }, options);

    // ===================== UI 엘리먼트 =====================
    const assocList = document.getElementById('assocList');
    const detailPane = document.getElementById('detailPane');
    const detailNodePill = document.getElementById('detailNodePill');
    const toast = new bootstrap.Toast(document.getElementById('liveToast'));
    const toastMsg = document.getElementById('toastMsg');

    // ===================== 공용 함수 =====================
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    }
    function showError(msg) { toastMsg.textContent = msg || '오류가 발생했습니다.'; toast.show(); }

    function showDetail(info) {
        detailNodePill.hidden = false;
        detailNodePill.textContent = info.group || 'PART';
        detailPane.innerHTML = `
      <div class="mb-2">
        <div class="fs-5 fw-semibold">${escapeHtml(info.label || info.name)}</div>
        <div class="text-secondary small">ID: ${escapeHtml(info.id)}</div>
      </div>
      <hr>
      <dl class="row mb-0" id="attrList">
        ${Object.entries(info.attributes || {}).map(([k,v]) => `
          <dt class="col-4">${escapeHtml(k)}</dt>
          <dd class="col-8">${escapeHtml(v)}</dd>
        `).join('')}
      </dl>
      <div class="d-grid gap-2 mt-3">
        <button class="btn btn-outline-primary btn-sm" type="button">BOM 보기 (미구현)</button>
        <button class="btn btn-outline-primary btn-sm" type="button">ECO 이력 (미구현)</button>
        <button class="btn btn-outline-primary btn-sm" type="button">ERP 재고 (미구현)</button>
      </div>
    `;
    }

    function renderGraph(data) {
        nodes.clear(); edges.clear();

        // 중심 노드
        nodes.add({
            id: data.root.id,
            label: data.root.label || data.root.id,
            group: 'ROOT',
            size: 22,
            attributes: data.root.attributes || {}
        });

        // 1차 연관
        data.related.forEach((n) => {
            nodes.add({
                id: n.id,
                label: n.label,
                group: n.group || 'PART',
                attributes: n.attributes || {}
            });
            edges.add({ from: data.root.id, to: n.id, label: n.edgeLabel || undefined });
        });

        // 2차 이상
        (data.secondLevel || []).forEach((e) => {
            if (!nodes.get(e.from)) nodes.add({ id: e.from, label: e.from, group: 'PART' });
            if (!nodes.get(e.to)) nodes.add({ id: e.to, label: e.to, group: 'PART' });
            edges.add({ from: e.from, to: e.to, label: e.edgeLabel || undefined });
        });

        network.stabilize();
        network.fit({ animation: true });
    }

    function renderList(data) {
        assocList.innerHTML = '';
        if (!data.related.length) {
            assocList.innerHTML = '<div class="list-group-item text-secondary">연관 부품이 없습니다.</div>';
            return;
        }
        data.related.forEach((n) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
            btn.innerHTML = `
        <div>
          <div class="fw-semibold">${escapeHtml(n.label)}</div>
          <small>ID: ${escapeHtml(n.id)} · 관계: ${escapeHtml(n.edgeLabel || '—')}</small>
        </div>
        <span class="badge text-bg-secondary">${escapeHtml(n.group || 'PART')}</span>
      `;
            btn.addEventListener('click', () => {
                network.selectNodes([n.id], false);
                network.focus(n.id, { animation: true, scale: 1 });
                showDetail({ id: n.id, label: n.label, group: n.group || 'PART', attributes: n.attributes || {} });
            });
            assocList.appendChild(btn);
        });
    }

    // ===================== 이벤트 바인딩 =====================
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const partNo = document.getElementById('inputPart').value.trim();
        const depth = document.getElementById('depthSelect').value;
        const relType = document.getElementById('relationType').value;
        if (!partNo) return;

        try {
            // TODO: 실제 API 연동
            // const res = await fetch(`/api/associations?part=${encodeURIComponent(partNo)}&depth=${depth}&type=${relType}`);
            // const data = await res.json();

            const data = mockFetch(partNo, depth, relType); // 데모
            renderGraph(data);
            renderList(data);
            showDetail({ id: data.root.id, label: data.root.label, group: 'ROOT', attributes: data.root.attributes });
        } catch (err) {
            console.error(err);
            showError('검색 중 오류가 발생했습니다.');
        }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        nodes.clear(); edges.clear();
        assocList.innerHTML = '';
        detailPane.innerHTML = '<div class="text-secondary">노드 혹은 리스트 항목을 선택해주세요.</div>';
        detailNodePill.hidden = true;
    });

    document.getElementById('fitBtn').addEventListener('click', () => network.fit({ animation: true }));

    document.getElementById('exportPngBtn').addEventListener('click', () => {
        const canvas = container.querySelector('canvas');
        if (!canvas) return;
        const dataUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = 'related-parts.png';
        a.click();
    });

    // 그래프 상호작용
    network.on("click", (params) => {
        if (params.nodes.length) {
            const id = params.nodes[0];
            const node = nodes.get(id);
            showDetail({
                id: node.id,
                label: node.label,
                group: node.group || 'PART',
                attributes: node.attributes || {}
            });
        } else {
            // 빈 공간 클릭 시 선택해제
            network.unselectAll();
        }
    });

    // 단축키
    window.addEventListener('keydown', (e) => {
        if (e.key === 'F' || e.key === 'f') network.fit({ animation: true });
        if (e.key === 'R' || e.key === 'r') network.stabilize();
        if (e.key === 'Escape') network.unselectAll();
    });

    // ===================== 샘플 데이터 (초기 표시) =====================
    function mockFetch(rootId, depth = 2, relType = 'co-usage') {
        // 샘플 카테고리별 노드
        const related = [
            { id: rootId + '-A1', label: '가이드레일', group: 'MECH', edgeLabel: '동시사용', attributes: { 규격: 'T-75', Maker: 'HYEL' } },
            { id: rootId + '-A2', label: '로프', group: 'MECH', edgeLabel: '동시사용', attributes: { 규격: '8x19', 길이: '120m' } },
            { id: rootId + '-A3', label: '제어반', group: 'ELEC', edgeLabel: '동시사용', attributes: { FW: 'v2.1.4' } },
            { id: rootId + '-A4', label: '도어모터', group: 'ELEC', edgeLabel: '동시사용', attributes: { 모델: 'DM-200', 전압: '24V' } },
            { id: rootId + '-A5', label: '카프레임', group: 'MECH', edgeLabel: '동시사용', attributes: { 재질: 'SS400' } },
        ];

        // 깊이에 따른 2차 링크 생성
        const secondLevel = [];
        if (Number(depth) > 1) {
            related.forEach(r => {
                secondLevel.push({ from: r.id, to: r.id + '-S1', edgeLabel: '세트구성' });
                secondLevel.push({ from: r.id, to: r.id + '-S2', edgeLabel: '세트구성' });
            });
        }
        if (Number(depth) > 2) {
            secondLevel.push({ from: rootId + '-A3-S1', to: rootId + '-A3-S1-X', edgeLabel: '호환' });
        }

        return {
            root: { id: rootId, label: rootId, attributes: { 기준: '검색 자재', 관계유형: relType, 깊이: String(depth) } },
            related,
            secondLevel
        };
    }

    // 페이지 로드 시 샘플 표시
    window.addEventListener('DOMContentLoaded', () => {
        const sampleId = 'ROOT-1001';
        document.getElementById('inputPart').value = sampleId;
        document.getElementById('depthSelect').value = '2';
        document.getElementById('relationType').value = 'co-usage';

        const sample = mockFetch(sampleId, 2, 'co-usage');
        renderGraph(sample);
        renderList(sample);
        showDetail({ id: sample.root.id, label: sample.root.label, group: 'ROOT', attributes: sample.root.attributes });
    });
</script>
</body>
</html>
