<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Elevator Safety Training – MVP (three.js)</title>
    <style>
        :root{
            --bg: #0b1020; --card:#11193a; --ink:#dce2ff; --accent:#7aa2ff; --ok:#29d398; --warn:#ffcf5a; --bad:#ff6b6b;
        }
        html,body{height:100%;margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a245a22,transparent),var(--bg);color:var(--ink);font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Pretendard,Apple SD Gothic Neo,Helvetica,Arial,"Noto Sans",sans-serif;}
        #app{display:grid;grid-template-columns: 320px 1fr;grid-template-rows:auto 1fr;gap:8px;height:100%;}
        header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0d1432;border-bottom:1px solid #2b3566}
        header h1{font-size:16px;margin:0;letter-spacing:.2px}
        header .pill{background:#17204e;border:1px solid #29377b;color:#b6c2ff;padding:6px 10px;border-radius:999px;font-size:12px}
        aside{background:linear-gradient(180deg,#0e1640,#0a1130);border-right:1px solid #26306a;padding:12px 12px 80px;overflow:auto}
        main{position:relative}
        .card{background:var(--card);border:1px solid #2b3566;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 6px 20px #0004}
        .card h3{margin:0 0 6px;font-size:14px;color:#cfe0ff}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;border:1px solid #2a3570;background:#101a45;color:#dfe6ff;cursor:pointer;font-size:13px}
        .btn:hover{filter:brightness(1.15)}
        .btn[disabled]{opacity:.5;cursor:not-allowed}
        .btn-ghost{background:transparent}
        .btn-primary{background:linear-gradient(180deg,#2b46b7,#253b9c);border-color:#4052b6}
        .grid{display:grid;gap:8px}
        .grid.cols-2{grid-template-columns:1fr 1fr}
        .badge{padding:3px 8px;border-radius:999px;font-size:11px;border:1px solid #2a3570;background:#0f183f;color:#cfe0ff}
        .good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
        #hud{position:absolute;inset:0;pointer-events:none}
        #hud .top{position:absolute;left:10px;top:10px;background:#0b1336aa;border:1px solid #29377b;border-radius:12px;padding:8px 10px;backdrop-filter: blur(6px)}
        #hud .top strong{color:#fff}
        #hud .bottom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#0b1336aa;border:1px solid #29377b;border-radius:12px;padding:8px 12px;pointer-events:auto}
        #canvas{width:100%;height:100%;display:block;background:linear-gradient(#0a0f25,#070b1a)}
        .toast{position:fixed;right:14px;bottom:14px;background:#0f183f;color:#e6ecff;border:1px solid #2a3570;padding:10px 12px;border-radius:12px;box-shadow:0 10px 30px #0006;display:none}
        .toast.show{display:block;animation:fadein .2s ease-out}
        @keyframes fadein{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .modal{position:fixed;inset:0;background:#0008;display:none;place-items:center}
        .modal .panel{width:min(560px,92vw);background:#0e1640;border:1px solid #2a3570;border-radius:14px;padding:16px}
        .panel h2{margin:0 0 8px}
        .small{font-size:12px;opacity:.8}
        .list{display:flex;flex-direction:column;gap:6px}
        .list .row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
    </style>
</head>
<body>
<div id="app">
    <header>
        <h1>Elevator Safety Training – MVP</h1>
        <div style="display:flex;align-items:center;gap:8px">
            <span class="pill" id="user-pill">사번: DEMO-001 · 이름: Trainee</span>
            <button class="btn btn-ghost" id="resetProgress">진행도 초기화</button>
            <button class="btn btn-primary" id="exportCert">수료증 내보내기</button>
        </div>
    </header>

    <aside>
        <div class="card">
            <h3>모듈 선택</h3>
            <div class="grid">
                <button class="btn" data-module="fall">① 추락 방지</button>
                <button class="btn" data-module="loto">② LOTO(전원격리)</button>
                <button class="btn" data-module="door">③ 도어 협업</button>
            </div>
        </div>

        <div class="card" id="goalsCard">
            <h3>학습 목표</h3>
            <ul style="margin:0 0 8px 18px;font-size:13px;line-height:1.5">
                <li>표준 절차 순서대로 작업하기</li>
                <li>위험요인(추락·감전·요추부하) 사전 제거</li>
                <li>핵심 안전 항목 미준수 시 즉시 피드백</li>
            </ul>
            <div class="badge">MVP v0.1</div>
        </div>

        <div class="card">
            <h3>체크리스트</h3>
            <div id="checklist" class="list"></div>
        </div>

        <div class="card">
            <h3>점수</h3>
            <div class="row"><span>현재 모듈</span><strong id="modLabel">-</strong></div>
            <div class="row"><span>정답/오답</span><strong><span id="okCnt">0</span> / <span id="badCnt">0</span></strong></div>
            <div class="row"><span>핵심 안전 항목</span><strong id="coreGate" class="warn">미충족</strong></div>
            <hr style="border:0;border-top:1px solid #2a3570;margin:8px 0"/>
            <div class="row"><span>모듈 통과</span><strong id="passState">-</strong></div>
            <button class="btn" id="retry">리셋 & 재도전</button>
        </div>

        <div class="card">
            <h3>조작</h3>
            <div class="grid cols-2">
                <button class="btn" id="hintBtn">힌트 보기</button>
                <button class="btn" id="showErrors">오답노트</button>
                <button class="btn" id="snapShot">장면 캡처</button>
                <button class="btn" id="toggleLabels">라벨 표시</button>
            </div>
            <p class="small" style="margin-top:8px">마우스: 회전/이동/휠 줌 · 개체 클릭/드래그</p>
        </div>
    </aside>

    <main>
        <canvas id="canvas"></canvas>
        <div id="hud">
            <div class="top"><strong id="hudTitle">모듈을 선택하세요</strong><div class="small" id="hudTip">안전 절차를 순서대로 수행하면 통과합니다.</div></div>
            <div class="bottom">
                <button class="btn" id="nextStep">다음 단계</button>
                <button class="btn" id="prevStep">이전 단계</button>
            </div>
        </div>
    </main>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="resultModal">
    <div class="panel">
        <h2>모듈 결과</h2>
        <div class="list" id="resultList"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
            <button class="btn" id="closeModal">닫기</button>
            <button class="btn btn-primary" id="saveProgress">진행도 저장</button>
        </div>
    </div>
</div>

<script type="module">
    //import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    //import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    // --- Minimal state ---
    const canvas = document.getElementById('canvas');
    const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600) };
    let scene, camera, renderer, controls, raycaster, mouse;
    let labelsVisible = true;
    let currentModule = null; // 'fall' | 'loto' | 'door'
    let stepIndex = 0; // procedure step
    let ok=0, bad=0; let coreSatisfied=false; let errors=[];

    const modules = {
        fall: {
            title: '추락 방지 – 승강로 가설 난간 & 안전벨트',
            steps: [
                { id:'place-guard', label:'난간/바리케이드 설치', core:true },
                { id:'attach-lanyard', label:'앵커 포인트에 안전벨트 체결', core:true },
                { id:'enter-shaft', label:'승강로 접근', core:false },
            ]
        },
        loto: {
            title: 'LOTO – 전원 격리 및 전압 확인',
            steps: [
                { id:'power-off', label:'메인 차단기 OFF', core:true },
                { id:'lock-tag', label:'자물쇠 & 태그 부착', core:true },
                { id:'voltage-test', label:'비접촉 전압 테스트', core:true },
                { id:'panel-open', label:'컨트롤러 패널 개방', core:false },
            ]
        },
        door: {
            title: '도어 설치 협업 – 2인 운반 & 인터록 배선',
            steps: [
                { id:'request-helper', label:'2인 작업 호출', core:true },
                { id:'lift-door', label:'도어 리프팅(2인)', core:true },
                { id:'wire-interlock', label:'인터록 배선 순서 연결', core:false },
            ]
        }
    };

    // --- Utility: scene factory ---
    function makeLabel(text){
        const div=document.createElement('div');
        div.textContent=text; div.style.position='absolute'; div.style.fontSize='12px'; div.style.color='#dfe6ff'; div.style.pointerEvents='none';
        div.style.textShadow='0 1px 2px #000, 0 0 10px #88a';
        document.body.appendChild(div); return {el:div, pos:new THREE.Vector3()};
    }
    const worldLabels = [];
    function updateLabelPosition(label, pos){
        label.pos.copy(pos);
        const p = label.pos.clone().project(camera);
        const x = (p.x * 0.5 + 0.5) * renderer.domElement.clientWidth;
        const y = (-p.y * 0.5 + 0.5) * renderer.domElement.clientHeight;
        label.el.style.transform = `translate(${x}px,${y}px)`;
        label.el.style.display = labelsVisible ? 'block' : 'none';
    }

    function setup(){
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({canvas});
        renderer.setSize(window.innerWidth, window.innerHeight);


        controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(3,3,5);
        controls.update();


        const light = new THREE.DirectionalLight(0xffffff,1);
        light.position.set(5,10,7);
        scene.add(light);


        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(10,10),
            new THREE.MeshStandardMaterial({color:0x223355, side:THREE.DoubleSide})
        );
        floor.rotation.x = -Math.PI/2;
        scene.add(floor);


        animate();
    }

    function onResize(){
        camera.aspect = canvas.clientWidth/canvas.clientHeight; camera.updateProjectionMatrix();
        renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    }

    function animate(){
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // --- Interaction & Game Logic ---
    function setModule(key){
        currentModule = key; stepIndex=0; ok=0; bad=0; coreSatisfied=false; errors=[];
        document.getElementById('modLabel').textContent = key.toUpperCase();
        document.getElementById('okCnt').textContent = '0';
        document.getElementById('badCnt').textContent = '0';
        document.getElementById('coreGate').textContent='미충족'; document.getElementById('coreGate').className='bad';
        document.getElementById('passState').textContent='진행 중';
        document.getElementById('hudTitle').textContent = modules[key].title;
        renderChecklist();
        resetWorldForModule();
        toast('모듈 시작: '+modules[key].title);
    }

    function resetWorldForModule(){
        // Reset visuals
        scene.getObjectByName('guard-rail-front').visible=false;
        scene.getObjectByName('guard-rail-back').visible=false;
        scene.getObjectByName('guard-rail-left').visible=false;
        scene.getObjectByName('guard-rail-right').visible=false;
        scene.getObjectByName('anchor').userData.attached=false;
        const breaker=scene.getObjectByName('breaker'); breaker.userData.state='ON'; breaker.material.color.set(0xff6b6b); breaker.position.z=0.2;
        scene.getObjectByName('padlock').visible=false; scene.getObjectByName('tag').visible=false;
        const helper=scene.getObjectByName('helper'); helper.visible=false;
        const door=scene.getObjectByName('door'); door.position.set(3.2,1.05,0); door.userData.lifted=false; door.userData.wired=false;
    }

    function currentStep(){ return modules[currentModule].steps[stepIndex]; }
    function isCorePassed(){
        const coreIds = modules[currentModule].steps.filter(s=>s.core).map(s=>s.id);
        const passed = coreIds.every(id=> document.querySelector(`[data-step="${id}"]`).dataset.ok==='1');
        document.getElementById('coreGate').textContent = passed? '충족':'미충족';
        document.getElementById('coreGate').className = passed? 'good':'bad';
        coreSatisfied = passed; return passed;
    }

    function renderChecklist(){
        const box=document.getElementById('checklist'); box.innerHTML='';
        modules[currentModule].steps.forEach((s,i)=>{
            const row=document.createElement('div'); row.className='row'; row.innerHTML=`<span>${i+1}. ${s.label} ${s.core?'<span class="badge">핵심</span>':''}</span><strong data-step="${s.id}" data-ok="0">-</strong>`; box.appendChild(row);
        });
    }

    function markStep(id, okFlag){
        const el = document.querySelector(`[data-step="${id}"]`);
        if(!el) return;
        if(el.dataset.ok==='1') return; // already OK
        if(okFlag){ ok++; el.textContent='OK'; el.style.color='var(--ok)'; el.dataset.ok='1'; }
        else { bad++; el.textContent='오답'; el.style.color='var(--bad)'; el.dataset.ok='-1'; errors.push({id, label: modules[currentModule].steps.find(s=>s.id===id)?.label}); }
        document.getElementById('okCnt').textContent = ok;
        document.getElementById('badCnt').textContent = bad;
        isCorePassed();
        // Pass condition: all steps OK
        const allOk = [...document.querySelectorAll('#checklist [data-ok="1"]')].length === modules[currentModule].steps.length;
        if(allOk){ showResult(); }
    }

    function showResult(){
        document.getElementById('passState').textContent = coreSatisfied? '통과':'실패(핵심 미충족)';
        const list=document.getElementById('resultList'); list.innerHTML='';
        list.insertAdjacentHTML('beforeend',`<div class="row"><span>모듈</span><strong>${modules[currentModule].title}</strong></div>`);
        list.insertAdjacentHTML('beforeend',`<div class="row"><span>정답/오답</span><strong>${ok} / ${bad}</strong></div>`);
        list.insertAdjacentHTML('beforeend',`<div class="row"><span>핵심 항목</span><strong>${coreSatisfied? '충족':'미충족'}</strong></div>`);
        if(errors.length){
            list.insertAdjacentHTML('beforeend','<hr style="border:0;border-top:1px solid #2a3570">');
            list.insertAdjacentHTML('beforeend','<div class="small">오답 항목</div>');
            errors.forEach(e=> list.insertAdjacentHTML('beforeend',`<div class="row"><span>${e.label}</span><span>재학습</span></div>`));
        }
        document.getElementById('resultModal').style.display='grid';
    }

    // --- Picking ---
    function onPointerDown(e){
        if(!currentModule) return;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
        mouse.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(scene.children, true);
        if(hits.length===0) return;
        const obj = hits[0].object;
        if(currentModule==='fall') handleFallClick(obj);
        if(currentModule==='loto') handleLotoClick(obj);
        if(currentModule==='door') handleDoorClick(obj);
    }

    // FALL logic
    function handleFallClick(obj){
        const step = currentStep();
        if(step.id==='place-guard'){
            if(['guard-rail-front','guard-rail-back','guard-rail-left','guard-rail-right','shaft'].includes(obj.name)){
                // Toggle all guards on
                scene.getObjectByName('guard-rail-front').visible=true;
                scene.getObjectByName('guard-rail-back').visible=true;
                scene.getObjectByName('guard-rail-left').visible=true;
                scene.getObjectByName('guard-rail-right').visible=true;
                markStep('place-guard', true); toast('난간 설치 완료'); stepIndex=1;
            } else { markStep('place-guard', false); toast('먼저 난간을 설치해야 합니다'); }
        } else if(step.id==='attach-lanyard'){
            if(obj.name==='anchor'){
                obj.userData.attached=true; obj.material.emissive = new THREE.Color(0x113311);
                markStep('attach-lanyard', true); toast('안전벨트 체결 OK'); stepIndex=2;
            } else { markStep('attach-lanyard', false); toast('앵커 포인트에 체결하세요'); }
        } else if(step.id==='enter-shaft'){
            // Only allowed if guards+lanyard are OK
            const guardsOK = document.querySelector('[data-step="place-guard"]').dataset.ok==='1';
            const lanyOK = document.querySelector('[data-step="attach-lanyard"]').dataset.ok==='1';
            if(guardsOK && lanyOK){ markStep('enter-shaft', true); toast('접근 허용'); }
            else { markStep('enter-shaft', false); toast('난간/벨트 미준수 상태 접근 금지'); }
        }
    }

    // LOTO logic
    function handleLotoClick(obj){
        const step = currentStep();
        const breaker=scene.getObjectByName('breaker');
        if(step.id==='power-off'){
            if(obj===breaker){
                breaker.userData.state = 'OFF'; breaker.material.color.set(0x7aa2ff); breaker.position.z=0.05;
                markStep('power-off', true); toast('차단기 OFF'); stepIndex=1;
            } else { markStep('power-off', false); toast('메인 차단기를 먼저 OFF 하세요'); }
        } else if(step.id==='lock-tag'){
            if(breaker.userData.state==='OFF' && (obj.name==='breaker' || obj.name==='breaker-base')){
                scene.getObjectByName('padlock').visible=true; scene.getObjectByName('tag').visible=true;
                markStep('lock-tag', true); toast('Lock & Tag 완료'); stepIndex=2;
            } else { markStep('lock-tag', false); toast('OFF 후 잠금/태그 절차를 수행하세요'); }
        } else if(step.id==='voltage-test'){
            if(breaker.userData.state==='OFF' && scene.getObjectByName('padlock').visible && (obj.name==='tester' || obj.name==='panel')){
                markStep('voltage-test', true); toast('전압 없음 확인'); stepIndex=3;
            } else { markStep('voltage-test', false); toast('OFF/잠금/태그 후 전압을 확인하세요'); }
        } else if(step.id==='panel-open'){
            if(document.querySelector('[data-step="voltage-test"]').dataset.ok==='1' && obj.name==='panel'){
                markStep('panel-open', true); toast('패널 개방 허용');
            } else { markStep('panel-open', false); toast('전압 확인 전 개방 금지'); }
        }
    }

    // DOOR logic
    function handleDoorClick(obj){
        const step = currentStep();
        const door=scene.getObjectByName('door'); const helper=scene.getObjectByName('helper');
        if(step.id==='request-helper'){
            if(obj.name==='door' || obj.name==='floor'){
                helper.visible=true; markStep('request-helper', true); toast('보조 인원 배정됨'); stepIndex=1;
            } else { markStep('request-helper', false); toast('2인 작업을 요청하세요'); }
        } else if(step.id==='lift-door'){
            if(helper.visible && obj.name==='door'){
                door.userData.lifted=true; door.position.y=1.25; markStep('lift-door', true); toast('2인 리프팅 OK'); stepIndex=2;
            } else if(!helper.visible){ markStep('lift-door', false); toast('보조 인원 없이 들어올릴 수 없습니다'); }
        } else if(step.id==='wire-interlock'){
            if(door.userData.lifted && (obj.name==='door' || obj.name==='panel')){
                door.userData.wired=true; markStep('wire-interlock', true); toast('인터록 배선 연결 완료');
            } else { markStep('wire-interlock', false); toast('리프팅 후 배선을 연결하세요'); }
        }
    }

    // --- UI wiring ---
    setup();

    document.querySelectorAll('[data-module]').forEach(btn=> btn.addEventListener('click', ()=> setModule(btn.dataset.module)) );

    document.getElementById('retry').addEventListener('click', ()=> { if(currentModule){ setModule(currentModule); } });

    document.getElementById('hintBtn').addEventListener('click', ()=>{
        if(!currentModule) return; const step=currentStep();
        const hints={
            'place-guard':'승강로 주변에 파란 난간을 설치하세요. 승강로/바닥을 클릭해도 설치됩니다.',
            'attach-lanyard':'녹색 구체(앵커)에 안전벨트를 체결하세요.',
            'enter-shaft':'난간과 벨트가 완료된 후에만 접근 가능합니다.',
            'power-off':'빨간 차단기를 눌러 OFF로 바꾸세요.',
            'lock-tag':'OFF 후 자물쇠/태그를 부착하세요(차단기 영역 클릭).',
            'voltage-test':'파란 콘(테스터)로 패널 부근에서 전압을 확인하세요.',
            'panel-open':'전압 확인 이후 패널을 여세요.',
            'request-helper':'도어 또는 바닥을 클릭해 보조 인원을 호출하세요.',
            'lift-door':'보조 인원이 온 뒤 도어를 들어 올리세요.',
            'wire-interlock':'리프팅 완료 후 도어/패널에서 배선을 연결하세요.'
        };
        toast(hints[step.id]||'');
    });

    document.getElementById('showErrors').addEventListener('click', ()=>{
        if(!errors.length) toast('오답 없음'); else toast('오답: '+errors.map(e=>e.label).join(', '));
    });

    document.getElementById('toggleLabels').addEventListener('click', ()=>{ labelsVisible=!labelsVisible; });

    document.getElementById('snapShot').addEventListener('click', ()=>{
        const data = renderer.domElement.toDataURL('image/png');
        const a=document.createElement('a'); a.href=data; a.download=`capture_${currentModule||'scene'}.png`; a.click();
    });

    document.getElementById('nextStep').addEventListener('click', ()=>{ if(!currentModule) return; stepIndex=Math.min(stepIndex+1, modules[currentModule].steps.length-1); toast('단계: '+(stepIndex+1)); });

    document.getElementById('prevStep').addEventListener('click', ()=>{ if(!currentModule) return; stepIndex=Math.max(stepIndex-1, 0); toast('단계: '+(stepIndex+1)); });

    // Modal & progress
    const modal = document.getElementById('resultModal');
    document.getElementById('closeModal').addEventListener('click', ()=> modal.style.display='none');

    document.getElementById('saveProgress').addEventListener('click', ()=>{
        const key = `elev-safety:${currentModule}`;
        const data = { ok, bad, coreSatisfied, date: new Date().toISOString() };
        localStorage.setItem(key, JSON.stringify(data)); modal.style.display='none'; toast('진행도 저장 완료');
    });

    document.getElementById('resetProgress').addEventListener('click', ()=>{ localStorage.clear(); toast('저장된 진행도를 모두 삭제했습니다'); });

    document.getElementById('exportCert').addEventListener('click', ()=>{
        const entries = Object.keys(localStorage).filter(k=>k.startsWith('elev-safety:')).map(k=>({mod:k.split(':')[1], ...JSON.parse(localStorage.getItem(k)||'{}')}));
        if(!entries.length){ toast('저장된 수료 데이터가 없습니다'); return; }
        const lines = ['모듈,정답,오답,핵심충족,일자'];
        entries.forEach(e=> lines.push(`${e.mod},${e.ok||0},${e.bad||0},${e.coreSatisfied?'Y':'N'},${e.date||''}`));
        const blob = new Blob(["\ufeff"+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='elevator_safety_cert.csv'; a.click(); URL.revokeObjectURL(url);
    });

    // Auto-fit initial
    onResize();
</script>
</body>
</html>
