<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Noto Sans KR', sans-serif;
            overflow-x:hidden; background:#000; color:#fff;
        }

        /* 3D Canvas Background */
        #three-canvas {
            position:fixed; inset:0; z-index:-1; width:100%; height:100%;
            display:block;
        }

        /* Atmosphere overlay (은은한 비네팅 + 색그라데이션) */
        .cosmos-overlay {
            pointer-events:none;
            position:fixed; inset:0; z-index:0;
            background:
                    radial-gradient(1200px 800px at 20% 15%, rgba(0,40,120,0.25), transparent 60%),
                    radial-gradient(1000px 1000px at 80% 80%, rgba(100,0,120,0.22), transparent 65%),
                    radial-gradient(1500px 900px at 50% 50%, rgba(0,0,0,0.0), rgba(0,0,0,0.25) 70%, rgba(0,0,0,0.6) 100%);
            mix-blend-mode: screen;
        }

        /* Header Navigation */
        .navbar {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 1rem 0;
            transition: all 0.3s ease;
        }
        .navbar-brand { font-weight:700; font-size:1.5rem; color:#fff!important; text-decoration:none; }
        .nav-link { color:rgba(255,255,255,.8)!important; font-weight:500; margin:0 1rem; transition:.3s; }
        .nav-link:hover { color:#00d4ff!important; transform:translateY(-2px); }

        /* Hero Section */
        .hero-section { min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
        .hero-content { text-align:center; z-index:1; position:relative; }
        .hero-title {
            font-size:4rem; font-weight:700; margin-bottom:1rem;
            background: linear-gradient(45deg,#8be9ff,#4ea1ff,#a78bfa);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            animation:titleGlow 3s ease-in-out infinite alternate;
        }
        .hero-subtitle { font-size:1.5rem; color:rgba(255,255,255,.85); margin-bottom:2rem; animation:fadeInUp 1s ease-out .5s both; }
        .hero-description { font-size:1.1rem; color:rgba(255,255,255,.7); margin:0 auto 3rem; max-width:640px; animation:fadeInUp 1s ease-out .7s both; }

        .btn-primary-custom{
            background:linear-gradient(45deg,#00d4ff,#0084ff); border:none; padding:15px 40px; font-size:1.1rem; font-weight:600; border-radius:50px; margin:0 10px; transition:.3s; position:relative; overflow:hidden;
        }
        .btn-primary-custom:hover{ transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,212,255,.3); }
        .btn-primary-custom::before{
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
            transition:left .5s;
        }
        .btn-primary-custom:hover::before{ left:100%; }

        .btn-outline-custom{
            background:transparent; border:2px solid rgba(255,255,255,.3); padding:15px 40px; font-size:1.1rem; font-weight:600; border-radius:50px; margin:0 10px; color:#fff; transition:.3s;
        }
        .btn-outline-custom:hover{ background:rgba(255,255,255,.1); border-color:#00d4ff; color:#00d4ff; transform:translateY(-3px); }

        .features-section{
            padding:100px 0;
            background: linear-gradient(135deg, rgba(5,5,10,.6) 0%, rgba(10,10,20,.9) 100%);
            position:relative; z-index:1;
        }
        .feature-card{
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(20px);
            border:1px solid rgba(255,255,255,.1);
            border-radius:20px; padding:2rem; text-align:center; transition:.3s; height:100%;
        }
        .feature-card:hover{
            transform:translateY(-10px);
            background:rgba(255,255,255,.1); border-color:#00d4ff; box-shadow:0 20px 40px rgba(0,212,255,.2);
        }
        .feature-icon{ font-size:3rem; color:#00d4ff; margin-bottom:1rem; }
        .feature-title{ font-size:1.5rem; font-weight:600; margin-bottom:1rem; }
        .feature-description{ color:rgba(255,255,255,.75); line-height:1.6; }

        .scroll-indicator{ position:absolute; bottom:30px; left:50%; transform:translateX(-50%); animation:bounce 2s infinite; z-index:1; }
        .scroll-indicator i{ font-size:2rem; color:rgba(255,255,255,.6); }

        /* Animations */
        @keyframes titleGlow {
            0% { text-shadow:0 0 14px rgba(139,233,255,.35); }
            100% { text-shadow:0 0 32px rgba(139,233,255,.7), 0 0 54px rgba(167,139,250,.55); }
        }
        @keyframes fadeInUp { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }
        @keyframes bounce {
            0%,20%,50%,80%,100%{ transform:translateX(-50%) translateY(0); }
            40%{ transform:translateX(-50%) translateY(-10px); }
            60%{ transform:translateX(-50%) translateY(-5px); }
        }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }

        /* Loading */
        .loading-screen{ position:fixed; inset:0; width:100%; height:100%; background:#000; display:flex; align-items:center; justify-content:center; z-index:9999; transition:opacity .5s ease-out; }
        .loading-spinner{ width:60px; height:60px; border:3px solid rgba(0,212,255,.3); border-top:3px solid #00d4ff; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { from{transform:rotate(0);} to{transform:rotate(360deg);} }

        @media (max-width:768px){
            .hero-title{ font-size:2.6rem; }
            .hero-subtitle{ font-size:1.2rem; }
            .btn-primary-custom,.btn-outline-custom{
                padding:12px 30px; font-size:1rem; margin:5px; display:block; width:200px; margin-left:auto; margin-right:auto; margin-bottom:10px;
            }
        }
    </style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<script>
    /**
     * Cosmos Background for "무량공처"
     * Layers:
     *  1) FarStars: 거대한 구 내부에 찍은 아주 먼 별들 (느린 회전)
     *  2) Nebula: 노이즈 셰이더로 숨 쉬는 성운 (additive)
     *  3) Dust/Comets: 가까운 파티클 (빠른 파랄랙스)
     */

    let scene, camera, renderer;
    let farStars, nearDust, nebulaMesh;
    let clock, mouse = {x:0, y:0}, targetRot = {x:0, y:0};
    let driftPhase = Math.random()*1000;

    function createRenderer(){
        const canvas = document.getElementById('three-canvas');
        renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function createScene(){
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 4000);
        camera.position.set(0, 0, 6);
        clock = new THREE.Clock();
    }

    function createFarStars(){
        const count = Math.floor(8000 * densityScale());
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        for(let i=0;i<count;i++){
            // 랜덤 구 껍질에 점 찍기 (멀리)
            const r = 1200 + Math.random()*800;
            const theta = Math.acos(THREE.MathUtils.randFloatSpread(2)); // 0~π
            const phi = Math.random() * Math.PI * 2;
            const x = r * Math.sin(theta) * Math.cos(phi);
            const y = r * Math.sin(theta) * Math.sin(phi);
            const z = r * Math.cos(theta);
            pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;

            // 차가운 푸른빛 위주, 일부는 따뜻한 색
            const c = new THREE.Color();
            if (Math.random() < 0.85) c.setHSL(0.60 + Math.random()*0.1, 0.6, 0.6+Math.random()*0.3);
            else c.setHSL(0.07 + Math.random()*0.05, 0.7, 0.55+Math.random()*0.3);
            col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
        geo.setAttribute('color', new THREE.BufferAttribute(col,3));

        const mat = new THREE.PointsMaterial({
            size: 1.2, sizeAttenuation:true, transparent:true, opacity:0.9,
            vertexColors:true, depthWrite:false
        });
        farStars = new THREE.Points(geo, mat);
        scene.add(farStars);
    }

    function createNearDust(){
        const count = Math.floor(1500 * densityScale());
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const vel = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);

        for(let i=0;i<count;i++){
            // 카메라 주변의 큐브 영역에 분포
            pos[i*3]   = THREE.MathUtils.randFloatSpread(40);
            pos[i*3+1] = THREE.MathUtils.randFloatSpread(40);
            pos[i*3+2] = THREE.MathUtils.randFloatSpread(40);

            vel[i*3]   = THREE.MathUtils.randFloat(-0.02, 0.02);
            vel[i*3+1] = THREE.MathUtils.randFloat(-0.02, 0.02);
            vel[i*3+2] = THREE.MathUtils.randFloat(-0.02, 0.02);

            const c = new THREE.Color();
            c.setHSL(0.60 + Math.random()*0.15, 0.6, 0.55 + Math.random()*0.2);
            col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
        geo.setAttribute('color', new THREE.BufferAttribute(col,3));
        geo.setAttribute('velocity', new THREE.BufferAttribute(vel,3)); // 커스텀 속도

        const mat = new THREE.PointsMaterial({
            size: 0.06, sizeAttenuation:true, transparent:true, opacity:0.9,
            vertexColors:true, depthWrite:false, blending:THREE.AdditiveBlending
        });

        nearDust = new THREE.Points(geo, mat);
        scene.add(nearDust);
    }

    function createNebula(){
        // 성운: full-screen quad 대신 카메라 앞 큰 평면 + 노이즈 셰이더
        const geo = new THREE.PlaneBufferGeometry(40, 24, 1, 1);

        const vert = `
        varying vec2 vUv;
        void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
    `;

        // 간단한 프랙탈 노이즈 (FBM)로 성운 구현
        const frag = `
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        uniform vec2  uRes;
        uniform vec3  uColorA;
        uniform vec3  uColorB;
        uniform float uStrength;

        // hash / noise / fbm
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
        float noise(vec2 p){
            vec2 i = floor(p), f = fract(p);
            float a = hash(i);
            float b = hash(i + vec2(1.,0.));
            float c = hash(i + vec2(0.,1.));
            float d = hash(i + vec2(1.,1.));
            vec2 u = f*f*(3.0-2.0*f);
            return mix(a, b, u.x) + (c - a)*u.y*(1.0-u.x) + (d - b)*u.x*u.y;
        }
        float fbm(vec2 p){
            float v=0.0; float a=0.5;
            mat2 m = mat2(1.6,1.2,-1.2,1.6);
            for(int i=0;i<5;i++){
                v += a*noise(p); p = m*p; a *= 0.5;
            }
            return v;
        }

        void main(){
            // 중심으로 살짝 비네팅
            vec2 uv = vUv - 0.5;
            uv.x *= uRes.x/uRes.y;

            float t = uTime * 0.03;
            // 부드럽게 흐르는 fbm
            float n = fbm(uv*2.0 + vec2(t*0.8, -t*0.6));
            float n2 = fbm(uv*3.5 + vec2(-t*0.3, t*0.5));
            float neb = smoothstep(0.35, 1.0, n*0.6 + n2*0.5);

            // 중심부 밝기/투명도
            float radial = 1.0 - smoothstep(0.0, 0.9, length(uv)*1.1);
            float alpha = clamp(neb * radial * uStrength, 0.0, 0.9);

            vec3 col = mix(uColorA, uColorB, neb);
            // 미세한 별잇빛 느낌
            float twinkle = smoothstep(0.8,1.0,fbm(uv*20.0 + t*vec2(0.2, -0.15)));
            col += twinkle*0.25;

            gl_FragColor = vec4(col, alpha);
        }
    `;

        const mat = new THREE.ShaderMaterial({
            uniforms:{
                uTime:{ value:0 },
                uRes:{ value:new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uColorA:{ value:new THREE.Color(0x2741ff) }, // 차가운 푸른빛
                uColorB:{ value:new THREE.Color(0x7f3cff) }, // 보라빛
                uStrength:{ value: 0.9 }
            },
            vertexShader: vert,
            fragmentShader: frag,
            transparent:true,
            depthWrite:false,
            blending: THREE.AdditiveBlending
        });

        nebulaMesh = new THREE.Mesh(geo, mat);
        nebulaMesh.position.set(0,0,-2.5); // 카메라보다 약간 뒤
        scene.add(nebulaMesh);
    }

    function densityScale(){
        // 화면 크기에 따른 밀도 스케일
        const area = window.innerWidth * window.innerHeight;
        if (area > 2200000) return 1.2;
        if (area > 1200000) return 1.0;
        if (area > 600000)  return 0.75;
        return 0.5;
    }

    function onResize(){
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (nebulaMesh && nebulaMesh.material && nebulaMesh.material.uniforms){
            nebulaMesh.material.uniforms.uRes.value.set(window.innerWidth, window.innerHeight);
        }
    }

    function animate(){
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // 파랄랙스 목표 회전값 (마우스)
        const mx = (mouse.x - 0.5) * 0.6;
        const my = (mouse.y - 0.5) * 0.4;
        targetRot.x += (my - targetRot.x) * 0.03;
        targetRot.y += (mx - targetRot.y) * 0.03;

        // 느린 카메라 드리프트 (끝없는 공간감)
        const drift = 0.04;
        camera.position.x = Math.sin(t*0.07 + driftPhase) * drift;
        camera.position.y = Math.cos(t*0.05 + driftPhase) * drift;
        camera.lookAt(0,0,0);

        // Far stars: 아주 느리게
        if (farStars){
            farStars.rotation.y += 0.0001 + targetRot.y*0.002;
            farStars.rotation.x += 0.00005 + targetRot.x*0.002;
        }

        // Nebula: 시간/마우스 반영
        if (nebulaMesh){
            nebulaMesh.material.uniforms.uTime.value = t;
            nebulaMesh.rotation.z = Math.sin(t*0.02)*0.02 + targetRot.y*0.1;
        }

        // Near dust: 부유 + 약한 유성 효과
        if (nearDust){
            const pos = nearDust.geometry.attributes.position;
            const vel = nearDust.geometry.attributes.velocity;
            for (let i=0; i<pos.count; i++){
                const ix = i*3;
                pos.array[ix]   += vel.array[ix]   + targetRot.y*0.05;
                pos.array[ix+1] += vel.array[ix+1] + targetRot.x*0.05;
                pos.array[ix+2] += vel.array[ix+2];

                // 범위 밖으로 나가면 되감기
                const lim = 28;
                if (pos.array[ix]   > lim) pos.array[ix]   = -lim;
                if (pos.array[ix]   < -lim) pos.array[ix]  = lim;
                if (pos.array[ix+1] > lim) pos.array[ix+1] = -lim;
                if (pos.array[ix+1] < -lim) pos.array[ix+1] = lim;
                if (pos.array[ix+2] > lim) pos.array[ix+2] = -lim;
                if (pos.array[ix+2] < -lim) pos.array[ix+2] = lim;
            }
            pos.needsUpdate = true;
        }

        renderer.render(scene, camera);
    }

    function init3DBackground(){
        createRenderer();
        createScene();
        createFarStars();
        createNebula();
        createNearDust();

        // 이벤트
        window.addEventListener('resize', onResize, false);
        document.addEventListener('mousemove', (e)=>{
            mouse.x = e.clientX / window.innerWidth;
            mouse.y = e.clientY / window.innerHeight;
        });

        animate();
    }

    // ===== Smooth scroll for anchors =====
    document.querySelectorAll('a[href^="#"]').forEach(a=>{
        a.addEventListener('click', (e)=>{
            e.preventDefault();
            const t = document.querySelector(a.getAttribute('href'));
            if (t) t.scrollIntoView({behavior:'smooth', block:'start'});
        });
    });

    // Navbar bg on scroll
    window.addEventListener('scroll', ()=>{
        const navbar = document.querySelector('.navbar');
        navbar.style.background = (window.scrollY>50) ? 'rgba(0,0,0,0.95)' : 'rgba(0,0,0,0.9)';
    });

    // Intersection Observer for feature cards
    const observer = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
            if(entry.isIntersecting){
                entry.target.style.animation = 'fadeInUp .6s ease-out forwards';
            }
        });
    },{threshold:0.1, rootMargin:'0px 0px -50px 0px'});

    // Loading screen
    window.addEventListener('load', ()=>{
        setTimeout(()=>{
            const el = document.getElementById('loadingScreen');
            el.style.opacity='0';
            setTimeout(()=>{ el.style.display='none'; }, 500);
        }, 1200);
    });

    // DOM Ready
    document.addEventListener('DOMContentLoaded', ()=>{
        init3DBackground();

        document.querySelectorAll('.feature-card').forEach(c=>observer.observe(c));

        document.querySelectorAll('.btn-primary-custom, .btn-outline-custom').forEach(btn=>{
            btn.addEventListener('mouseenter', ()=> btn.style.animation='pulse .6s ease-in-out');
            btn.addEventListener('mouseleave', ()=> btn.style.animation='');
        });

        // hero content 미세 파랄랙스 (텍스트가 떠있는 느낌)
        document.addEventListener('mousemove', (e)=>{
            const hero = document.querySelector('.hero-content');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            hero.style.transform = `translate(${(x*10-5).toFixed(2)}px, ${(y*10-5).toFixed(2)}px)`;
        });


        const startBtn = document.querySelector('.btn-primary-custom');

        startBtn.addEventListener('click', () => {
            // body에 fade-out 클래스 추가
            document.body.classList.add('fade-out');

            // transition이 끝난 뒤 페이지 이동
            setTimeout(() => {
                window.location.href = 'view.html';
            }, 800); // transition 시간과 동일
        });
    });



</script>
</body>
