<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D View</title>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width,
                 initial-scale=1,
                 shrink-to-fit=no">

    <!--bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" ></script>

    <!--jquery-->
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.1/themes/base/jquery-ui.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!--APSviewer    -->
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/style.min.css?v=v7.*" type="text/css">
    <script language="JavaScript" src="https://developer.api.autodesk.com/modelderivative/v2/viewers/viewer3D.min.js?v=v7.*"></script>

    <link rel="stylesheet" href="http://cdn.jsdelivr.net/gh/autodesk-forge/forge-extensions/public/extensions/camerarotation/contents/main.css">
    <script src="http://cdn.jsdelivr.net/gh/autodesk-forge/forge-extensions/public/extensions/camerarotation/contents/main.js"></script>

</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        overflow: hidden;
        position: relative;
    }

    /* 배경 애니메이션 */
    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
                radial-gradient(circle at 20% 20%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
        animation: floatBackground 15s ease-in-out infinite;
        z-index: 0;
    }

    @keyframes floatBackground {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(1deg); }
    }

    /* Header Styles */
    .header {
        position: relative;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding: 1rem 0;
        animation: fadeInDown 0.8s ease-out;
    }

    .header-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 2rem;
    }

    .logo-section {
        display: flex;
        align-items: center;
        gap: 2rem;
    }

    .hyundai-logo {
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .logo-symbol {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        font-weight: bold;
        color: white;
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .brand-text {
        font-size: 1.5rem;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 1px;
    }

    .service-title {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 300;
        padding-left: 2rem;
        border-left: 2px solid rgba(255, 255, 255, 0.3);
    }

    /* Main Wrapper */
    .main-wrapper {
        position: relative;
        z-index: 1;
        height: calc(100vh - 140px);
        padding: 2rem;
        animation: fadeInUp 1s ease-out 0.3s both;
    }

    .content-container {
        height: 100%;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
    }

    .content-grid {
        display: grid;
        grid-template-columns: 350px 4px 1fr;
        height: 100%;
        gap: 0;
    }

    /* Parts Tree Panel */
    .parts-tree-panel {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        min-width: 250px;
        max-width: 500px;
        width: 350px;
    }

    .parts-tree-header {
        padding: 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
    }

    .parts-tree-title {
        color: #ffffff;
        font-size: 1.3rem;
        font-weight: 500;
        margin: 0;
        letter-spacing: 0.5px;
    }

    .parts-tree-content {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
    }

    /* Tree Item Styles */
    .tree-item {
        margin-bottom: 0.5rem;
    }

    .tree-item-content {
        display: flex;
        align-items: center;
        padding: 0.75rem;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        gap: 0.75rem;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 400;
        user-select: none;
    }

    .tree-item-content:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateX(5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .tree-item-content.selected {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
        border: 1px solid rgba(102, 126, 234, 0.5);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
    }

    .tree-toggle {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    .tree-toggle.expanded::before {
        content: '▼';
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
    }

    .tree-toggle.collapsed::before {
        content: '▶';
        font-size: 10px;
        color: rgba(255, 255, 255, 0.7);
    }

    .tree-toggle.leaf {
        opacity: 0;
    }

    .tree-icon {
        font-size: 1.1rem;
        opacity: 0.8;
    }

    .tree-label {
        flex: 1;
        font-size: 0.95rem;
    }

    .tree-children {
        margin-left: 1.5rem;
        border-left: 2px solid rgba(255, 255, 255, 0.1);
        padding-left: 1rem;
        transition: all 0.3s ease;
        overflow: hidden;
    }

    .tree-children.expanded {
        max-height: 1000px;
        opacity: 1;
    }

    .tree-children.collapsed {
        max-height: 0;
        opacity: 0;
    }

    /* Resize Handle */
    .resize-handle {
        background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
        cursor: ew-resize;
        position: relative;
        transition: all 0.3s ease;
    }

    .resize-handle:hover {
        background: linear-gradient(45deg, transparent 30%, rgba(102, 126, 234, 0.3) 50%, transparent 70%);
    }

    .resize-handle::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 2px;
        height: 30px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 1px;
    }

    /* 3D Viewer Section */
    .viewer-section {
        background: rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden;
    }

    #3DViewerDiv {
        width: 100%;
        height: 100%;
        border-radius: 0 20px 20px 0;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.1);
    }

    /* Footer */
    .footer {
        position: relative;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem 0;
    }

    .footer-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .footer-right {
        display: flex;
        align-items: center;
        gap: 2rem;
    }

    .developer-tag {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.9rem;
        font-weight: 400;
    }

    .copyright {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.85rem;
    }

    /* Scrollbar Styling */
    .parts-tree-content::-webkit-scrollbar {
        width: 6px;
    }

    .parts-tree-content::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
    }

    .parts-tree-content::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
    }

    .parts-tree-content::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
    }

    /* Loading Animation */
    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .main-wrapper {
            padding: 1rem;
        }

        .header-container {
            padding: 0 1rem;
        }

        .logo-section {
            flex-direction: column;
            gap: 1rem;
            text-align: center;
        }

        .service-title {
            border-left: none;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            padding-left: 0;
            padding-top: 1rem;
        }

        .content-grid {
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr;
        }

        .parts-tree-panel {
            max-height: 300px;
            width: 100%;
            max-width: none;
        }

        .resize-handle {
            display: none;
        }
    }
</style>

                                </div>
                                <div class="tree-children collapsed">
                                    <div class="tree-item">
                                        <div class="tree-item-content" onclick="selectPart(this)">
                                            <div class="tree-toggle leaf"></div>

                                    <div class="tree-item">

    /*--------------------------------------*/
    function toggleTreeItem(element) {
        const toggle = element.querySelector('.tree-toggle');
        const children = element.parentElement.querySelector('.tree-children');

        if (children && !toggle.classList.contains('leaf')) {
            if (toggle.classList.contains('expanded')) {
                toggle.classList.remove('expanded');
                toggle.classList.add('collapsed');
                children.classList.remove('expanded');
                children.classList.add('collapsed');
            } else {
                toggle.classList.remove('collapsed');
                toggle.classList.add('expanded');
                children.classList.remove('collapsed');
                children.classList.add('expanded');
            }
        }
    }

    function selectPart(element) {
        // Remove selection from all items
        document.querySelectorAll('.tree-item-content').forEach(item => {
            item.classList.remove('selected');
        });

        // Add selection to clicked item
        element.classList.add('selected');

        // Here you can add logic to highlight the selected part in the 3D viewer
        const partName = element.querySelector('.tree-label').textContent;
        console.log('Selected part:', partName);
    }

    // Resize functionality
    let isResizing = false;
    const resizeHandle = document.querySelector('.resize-handle');
    const partsPanel = document.querySelector('.parts-tree-panel');

    resizeHandle.addEventListener('mousedown', function(e) {
        isResizing = true;
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
    });

    function handleMouseMove(e) {
        if (!isResizing) return;

        const containerRect = document.querySelector('.content-grid').getBoundingClientRect();
        const newWidth = e.clientX - containerRect.left;

        if (newWidth >= 250 && newWidth <= 500) {
            partsPanel.style.width = newWidth + 'px';
        }
    }

    function handleMouseUp() {
        isResizing = false;
        document.removeEventListener('mousemove', handleMouseMove);
        document.removeEventListener('mouseup', handleMouseUp);
    }
</script>
