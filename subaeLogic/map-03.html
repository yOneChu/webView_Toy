<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MindMap • Highcharts NetworkGraph</title>

    <!-- Bootstrap -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>

    <!-- Highcharts (core + networkgraph + exporting + accessibility) -->
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/networkgraph.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;800&display=swap" rel="stylesheet"/>

    <style>
        :root{
            --brand:#00A650;         /* Hyundai green */
            --ink:#0e2a1f;
            --muted:#577d6c;
            --bg:#F6FAF7;
            --card:#fff;
            --line:#E2EEE7;
        }
        html,body{height:100%}
        body{
            font-family:"Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,"Apple SD Gothic Neo","맑은 고딕","Malgun Gothic",sans-serif;
            background:
                    radial-gradient(1000px 500px at 80% -10%, rgba(0,166,80,.10), transparent 60%),
                    linear-gradient(180deg,#fff 0%,var(--bg) 70%,#fff 100%);
            color:var(--ink);
            overflow:hidden;
        }
        .app-header{
            background:#ffffffcc; backdrop-filter:blur(6px);
            border-bottom:2px solid rgba(0,166,80,.2);
        }
        .logo-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;
            background:radial-gradient(circle at 30% 30%,#87f0bf,var(--brand)); box-shadow:0 0 10px rgba(0,166,80,.45);}
        .toolbar, .side{
            background:var(--card); border:1px solid var(--line);
            border-radius:16px; box-shadow:0 10px 26px rgba(16,35,27,.08); backdrop-filter:blur(6px);
        }
        .toolbar{position:absolute;left:50%;transform:translateX(-50%);top:74px;width:min(1200px,94vw);padding:14px 16px;z-index:5}
        .side{position:absolute;right:20px;top:162px;width:360px;max-width:92vw;padding:16px;z-index:5}
        .toolbar .form-control,.toolbar .form-select{background:#fff;border:1px solid var(--line);color:var(--ink)}
        .btn-brand{background:linear-gradient(135deg,var(--brand),#22c970);border:0;color:#092317;font-weight:700;border-radius:12px}
        .btn-outline-brand{border-color:var(--brand);color:#0a5b3a;border-radius:12px}
        .btn-outline-brand:hover{background:rgba(0,166,80,.12);color:#063b27}
        #container{
            position:absolute; inset:140px 16px 16px 16px; border-radius:18px; background:#fff;
            box-shadow:inset 0 0 0 1px var(--line);
        }
        .mini{font-size:.92rem;color:var(--muted)}
    </style>
</head>
<body>
<header class="app-header py-3">
    <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
            <span class="logo-dot"></span>
            <h1 class="h4 m-0 fw-bold">MindMap • NetworkGraph</h1>
            <span class="badge rounded-pill text-bg-success ms-2">Interactive</span>
        </div>
        <div class="small text-secondary">
            <i class="fa-solid fa-arrows-up-down-left-right me-1"></i>노드 드래그 ·
            <i class="fa-solid fa-magnifying-glass-plus me-1"></i>휠 확대/축소
        </div>
    </div>
</header>

<!-- Toolbar -->
<div class="toolbar">
    <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
            <label class="form-label mb-1">중앙 KEY</label>
            <input id="keyInput" class="form-control form-control-lg" value="PLM-VAULT MindMap"/>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label mb-1">자식 노드 라벨</label>
            <input id="childInput" class="form-control" placeholder="예) 대시보드"/>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label mb-1">부모 선택</label>
            <select id="parentSelect" class="form-select"></select>
        </div>
        <div class="col-12 col-md-2 d-grid d-md-flex gap-2">
            <button id="addBtn" class="btn btn-brand w-100"><i class="fa-solid fa-plus me-1"></i>추가</button>
        </div>

        <div class="col-12"><hr class="my-2"></div>

        <div class="col-12 col-md-3">
            <label class="form-label mb-1">검색/하이라이트</label>
            <input id="searchInput" class="form-control" placeholder="라벨 일부 입력 후 Enter"/>
        </div>
        <div class="col-12 col-md-5 d-grid d-md-flex gap-2">
            <button id="simBtn" class="btn btn-outline-brand w-100"><i class="fa-solid fa-atom me-1"></i>시뮬레이션 ON/OFF</button>
            <button id="resetBtn" class="btn btn-outline-brand w-100"><i class="fa-solid fa-rotate me-1"></i>초기화</button>
            <button id="delBtn" class="btn btn-outline-danger w-100"><i class="fa-solid fa-trash me-1"></i>선택 삭제</button>
        </div>
        <div class="col-12 col-md-2 d-grid d-md-flex gap-2">
            <button id="exportBtn" class="btn btn-outline-brand w-100"><i class="fa-regular fa-image me-1"></i>PNG 저장</button>
        </div>
    </div>
</div>

<!-- Right Panel -->
<aside class="side">
    <h6 class="fw-bold mb-1"><i class="fa-solid fa-square-nodes text-success me-2"></i>노드 정보</h6>
    <div id="nodeInfo" class="mini">노드를 클릭하면 정보가 표시됩니다.</div>
    <hr>
    <div class="mini">TIP: <b>시뮬레이션 ON</b> 상태에서 몇 노드를 드래그 → 레이아웃이 살아 움직이는 느낌을 보여주세요. (네트워크그래프 드래그/시뮬레이션은 기본 지원) :contentReference[oaicite:1]{index=1}</div>
</aside>

<!-- Chart container -->
<div id="container" role="region" aria-label="마인드맵 네트워크 그래프"></div>

<script>
    (function(){
        // ---------- State ----------
        let chart;
        let simOn = true;
        let selectedId = null;

        // data model
        const links = []; // {from, to}
        const nodeMap = new Map(); // id -> nodeOption

        // ---------- Helpers ----------
        const levelColor = (lv)=>{
            if(lv<=1) return '#00A650';
            if(lv===2) return '#55C98C';
            if(lv===3) return '#9BE7C7';
            return '#CBEFE4';
        };

        function bfsLevels(rootId){
            const g = {};
            links.forEach(e=>{
                (g[e.from] ??= []).push(e.to);
                (g[e.to] ??= []).push(e.from);
            });
            const q=[rootId]; const lv={}; lv[rootId]=0;
            const seen=new Set([rootId]);
            while(q.length){
                const u=q.shift();
                (g[u]||[]).forEach(v=>{
                    if(!seen.has(v)){ seen.add(v); lv[v]=(lv[u]??0)+1; q.push(v); }
                });
            }
            return lv;
        }

        function refreshParentSelect(){
            const sel = document.getElementById('parentSelect');
            sel.innerHTML = '';
            [...nodeMap.keys()].forEach(id=>{
                const opt=document.createElement('option'); opt.value=id; opt.textContent=id; sel.appendChild(opt);
            });
        }

        function rebuildNodesByLevel(rootId){
            const levels=bfsLevels(rootId);
            nodeMap.forEach((node,id)=>{
                const lv = levels[id] ?? 1;
                node.color = levelColor(lv);
                node.marker = node.marker || {};
                node.marker.radius = Math.max(8, 26 - lv*4);
            });
        }

        function ensureNode(id, name){
            if(!nodeMap.has(id)){
                nodeMap.set(id, { id, name: name||id, color:'#9BE7C7', marker:{ radius:14 } });
            }
        }

        function seed(rootLabel){
            links.length=0; nodeMap.clear();
            const ROOT = rootLabel || 'KEY';
            ensureNode(ROOT, ROOT);
            nodeMap.get(ROOT).marker = { radius:28, lineWidth:1, lineColor:'#0a3d2d' };
            nodeMap.get(ROOT).color = '#00A650';

            const base = [
                ['전략',['목표','지표','로드맵']],
                ['시스템',['PLM 연계','Vault 연계','보안']],
                ['데이터',['스키마','거버넌스','카탈로그']],
                ['UI/UX',['대시보드','검색','다크테마']],
                ['운영',['모니터링','백업','장애대응']]
            ];
            base.forEach(([cat, children])=>{
                ensureNode(cat, cat);
                links.push({from:ROOT, to:cat});
                children.forEach(ch=>{
                    ensureNode(ch, ch);
                    links.push({from:cat, to:ch});
                });
            });
            rebuildNodesByLevel(ROOT);
        }

        function toSeries(){
            return {
                type: 'networkgraph',
                keys: ['from','to'],            // from/to 포맷 사용 (공식 문서) :contentReference[oaicite:2]{index=2}
                data: links.map(e=>[e.from, e.to]),
                nodes: [...nodeMap.values()],
                draggable: true,                // 노드 드래그 (기본 true) :contentReference[oaicite:3]{index=3}
                dataLabels: {
                    enabled: true, linkFormat: '',
                    style: { textOutline: 'none', fontWeight: '600', color: '#083526' }
                },
                marker: { lineWidth: 1, lineColor: '#e4f5ee' },
                point: {
                    events: {
                        click: function(){
                            if (this.isNode) {
                                selectedId = this.id;
                                document.getElementById('nodeInfo').innerHTML =
                                    `<div><b>라벨</b>: ${this.id}</div>
                 <div><b>연결 수</b>: ${this.linksTo.length}</div>`;
                            } else {
                                selectedId = null;
                                document.getElementById('nodeInfo').innerText = '노드를 클릭하면 정보가 표시됩니다.';
                            }
                        }
                    }
                },
                layoutAlgorithm: {
                    // 더 촘촘하게 모이는 세팅
                    enableSimulation: simOn,
                    integration: 'euler',
                    initialPositions: 'circle',      // 시작 배치를 원형으로
                    initialPositionRadius: 70,       // 시작 반경을 작게 → 초기에 모여있게
                    linkLength: 80,                  // (기본보다 짧게) 간격 핵심 파라미터
                    // 반발력(노드-노드 사이 밀어내는 힘) 약하게: 기본값 대비 35%만 적용
                    repulsiveForce: function (d, k) { return (k * k / d) * 0.35; },  // ↓ 밀집
                    // 인접 노드 끌어당기는 힘 약간 증폭
                    attractiveForce: function (d, k) { return (k - d) / k * 1.15; },
                    // 중심 끌림(바리센터) 살짝 강화 → 전체가 가운데로 모임
                    gravitationalConstant: 0.12,
                    maxIterations: 250               // 안정화 조금 더
                }

            };
        }

        function buildChart(){
            chart = Highcharts.chart('container', {
                chart: { height: '100%', backgroundColor: '#fff', animation: true },
                title: { text: null },
                credits: { enabled: false },
                exporting: { enabled: false }, // 우리가 버튼 제공
                tooltip: {
                    formatter: function(){
                        return this.point.isNode
                            ? `<b>${this.key}</b>`
                            : `${this.point.from} → ${this.point.to}`;
                    }
                },
                plotOptions: { networkgraph: { linkOpacity: 0.6 } },
                series: [ toSeries() ]
            });

            chart.container.style.cursor = 'grab';
        }

        function redraw(){
            chart.series[0].update(toSeries(), false);
            chart.redraw();
        }

        // ---------- Init ----------
        seed(document.getElementById('keyInput').value);
        document.addEventListener('DOMContentLoaded', ()=>{ buildChart(); refreshParentSelect(); });

        // ---------- UI events ----------
        document.getElementById('keyInput').addEventListener('change', (e)=>{
            const label = e.target.value.trim() || 'KEY';
            seed(label); redraw(); refreshParentSelect();
        });

        document.getElementById('addBtn').addEventListener('click', ()=>{
            const parent = document.getElementById('parentSelect').value || [...nodeMap.keys()][0];
            const label = (document.getElementById('childInput').value || '').trim();
            if(!label) return;
            ensureNode(label, label);
            links.push({from: parent, to: label});
            rebuildNodesByLevel(document.getElementById('keyInput').value.trim());
            redraw(); refreshParentSelect();
            document.getElementById('childInput').value='';
        });

        document.getElementById('delBtn').addEventListener('click', ()=>{
            if(!selectedId || !nodeMap.has(selectedId)) return;
            // 루트 삭제 방지
            if(selectedId === document.getElementById('keyInput').value.trim()){
                alert('중앙 KEY는 삭제할 수 없습니다.'); return;
            }
            // 링크 삭제
            for(let i=links.length-1;i>=0;i--){
                if(links[i].from===selectedId || links[i].to===selectedId) links.splice(i,1);
            }
            nodeMap.delete(selectedId);
            selectedId=null;
            rebuildNodesByLevel(document.getElementById('keyInput').value.trim());
            redraw(); refreshParentSelect();
            document.getElementById('nodeInfo').innerText='노드를 클릭하면 정보가 표시됩니다.';
        });

        document.getElementById('simBtn').addEventListener('click', ()=>{
            simOn = !simOn;
            redraw();
        });

        document.getElementById('resetBtn').addEventListener('click', ()=>{
            seed(document.getElementById('keyInput').value.trim()); redraw(); refreshParentSelect();
        });

        document.getElementById('searchInput').addEventListener('keydown', (e)=>{
            if(e.key!=='Enter') return;
            const q = e.target.value.trim().toLowerCase();
            // 기본 색 복원 후 매치만 옐로 하이라이트
            rebuildNodesByLevel(document.getElementById('keyInput').value.trim());
            if(q){
                nodeMap.forEach((n,id)=>{
                    if(id.toLowerCase().includes(q)){
                        n.color = '#FDB911';
                        n.marker = n.marker || {}; n.marker.lineColor = '#b37f00';
                    }
                });
            }
            redraw();
            e.target.select();
        });

        document.getElementById('exportBtn').addEventListener('click', ()=>{
            chart.exportChart({ type:'image/png', filename:'mindmap-highcharts' });
        });
    })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
