<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특성 코드 네트워크 뷰어</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/modules/networkgraph.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>

    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_MAP_APP_KEY&libraries=services"></script>

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }
        .header {
            background-color: #ffffff;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,.1);
            border: none;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        #network-graph-container {
            min-height: 600px;
        }
        #map-container {
            height: 400px;
            border-radius: 10px;
        }
        .sidebar {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <header class="header text-center mb-4">
        <h1 class="h3 fw-bold text-primary">특성 코드 네트워크 뷰어</h1>
    </header>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header text-center">
                        <h5 class="mb-0">코드 연관 관계 분석</h5>
                    </div>
                    <div class="card-body">
                        <div id="network-graph-container"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="sidebar">
                    <h5 class="fw-bold mb-3 text-secondary">선택된 코드 정보</h5>
                    <div class="mb-3">
                        <label for="code-id" class="form-label fw-bold">코드 ID</label>
                        <input type="text" class="form-control" id="code-id" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="code-name" class="form-label fw-bold">코드명</label>
                        <input type="text" class="form-control" id="code-name" readonly>
                    </div>
                    <div class="mb-4">
                        <label for="code-address" class="form-label fw-bold">주소</label>
                        <input type="text" class="form-control" id="code-address" readonly>
                    </div>

                    <div id="map-container" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        // Highcharts 네트워크 그래프 설정
        const chart = Highcharts.chart('network-graph-container', {
            chart: {
                type: 'networkgraph',
                height: '100%',
            },
            title: {
                text: '특성 코드-하위 코드 관계',
                style: {
                    display: 'none'
                }
            },
            plotOptions: {
                networkgraph: {
                    keys: ['from', 'to'],
                    layoutAlgorithm: {
                        linkLength: 100,
                        enableSimulation: true,
                        friction: -0.9
                    },
                    point: {
                        events: {
                            click: function () {
                                updateInfo(this.name);
                            }
                        }
                    }
                }
            },
            series: [{
                dataLabels: {
                    enabled: true,
                    linkFormat: '',
                    allowOverlap: true
                },
                data: [
                    // 예시 데이터: 실제 데이터로 교체하세요.
                    ['코드 A', '하위 코드 1'],
                    ['코드 A', '하위 코드 2'],
                    ['코드 B', '하위 코드 3'],
                    ['코드 B', '하위 코드 4'],
                    ['코드 A', '코드 B'], // 코드 간 연관 관계
                    ['하위 코드 1', '하위 코드 5']
                ]
            }]
        });

        // Kakao Maps API 설정
        const mapContainer = document.getElementById('map-container');
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 중심 좌표 (서울 시청)
            level: 3
        };
        const map = new kakao.maps.Map(mapContainer, mapOption);
        const geocoder = new kakao.maps.services.Geocoder();
        const marker = new kakao.maps.Marker({
            position: mapOption.center
        });
        marker.setMap(map);

        // 정보 업데이트 함수
        function updateInfo(codeName) {
            const data = {
                '코드 A': { id: 'A001', address: '서울 강남구 역삼동' },
                '하위 코드 1': { id: 'B001', address: '부산 해운대구' },
                '코드 B': { id: 'C001', address: '경기 성남시 분당구' },
                '하위 코드 2': { id: 'B002', address: '대구 수성구' },
                '하위 코드 3': { id: 'D001', address: '인천 연수구' },
                '하위 코드 4': { id: 'D002', address: '광주 서구' },
                '하위 코드 5': { id: 'E001', address: '대전 유성구' }
            };

            const selectedData = data[codeName];
            if (selectedData) {
                document.getElementById('code-id').value = selectedData.id;
                document.getElementById('code-name').value = codeName;
                document.getElementById('code-address').value = selectedData.address;

                // 주소로 좌표 검색
                geocoder.addressSearch(selectedData.address, function(result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                        map.setCenter(coords);
                        marker.setPosition(coords);
                    }
                });
            }
        }
    });
</script>
</body>
</html>
