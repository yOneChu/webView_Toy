<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영업사양 연결 구조도</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f7f9fc;
        }
        #network {
            width: 100%;
            height: 700px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h3 class="mb-4">영업사양 코드 네트워크</h3>
    <div id="network"></div>
</div>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script>
    // 노드 정의 (영업사양 코드들)
    const nodes = new vis.DataSet([
        { id: 'A101A', label: 'A101A', color: '#007fa8' },
        { id: 'A120', label: 'A120', color: '#007fa8' },
        { id: 'B120A', label: 'B120A', color: '#4caf50' },
        { id: 'C310', label: 'C310', color: '#f57c00' },
        { id: 'D150B', label: 'D150B', color: '#9c27b0' }
    ]);

    // 연결 관계 정의 (부품 간 의존성 또는 상위-하위 구조)
    const edges = new vis.DataSet([
        { from: 'A101A', to: 'A120' },
        { from: 'A120', to: 'B120A' },
        { from: 'B120A', to: 'C310' },
        { from: 'C310', to: 'D150B' }
    ]);

    const container = document.getElementById('network');
    const data = { nodes, edges };
    const options = {
        layout: {
            hierarchical: false
        },
        physics: {
            stabilization: false
        },
        nodes: {
            shape: 'box',
            font: { color: '#fff', size: 16, face: 'Noto Sans KR' },
            borderWidth: 1,
            widthConstraint: { minimum: 80 }
        },
        edges: {
            arrows: 'to',
            color: '#ccc',
            smooth: {
                type: 'cubicBezier',
                forceDirection: 'horizontal',
                roundness: 0.4
            }
        },
        interaction: {
            hover: true,
            tooltipDelay: 200
        }
    };
    new vis.Network(container, data, options);
</script>
</body>
</html>
