<!doctype html>
<html lang="ko" data-bs-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>현장 전층 자재·영업사양 현황</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- DataTables -->
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.10/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-buttons-bs5@2.4.3/css/buttons.bootstrap5.min.css" rel="stylesheet">

    <style>
        /* Modern / glassy hero */
        .hero {
            position: relative;
            border: 1px solid rgba(255,255,255,.2);
            background: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.18), transparent 60%),
            radial-gradient(1200px 600px at 110% 10%, rgba(16,185,129,.16), transparent 60%),
            linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.35));
            backdrop-filter: blur(8px);
            border-radius: 20px;
        }
        .stat-card {
            border: 1px solid rgba(0,0,0,.06);
            background: rgba(255,255,255,.7);
            backdrop-filter: blur(6px);
            border-radius: 16px;
        }
        @media (prefers-color-scheme: dark) {
            :root { color-scheme: dark; }
            .hero {
                background: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.18), transparent 60%),
                radial-gradient(1200px 600px at 110% 10%, rgba(16,185,129,.16), transparent 60%),
                linear-gradient(180deg, rgba(22,22,26,.85), rgba(22,22,26,.6));
                border-color: rgba(255,255,255,.08);
            }
            .stat-card { background: rgba(30,30,36,.7); border-color: rgba(255,255,255,.06);}
        }
        .badge-pill { border-radius: 999px; }
        .floor-pill {
            font-variant-numeric: tabular-nums;
            letter-spacing: .3px;
        }
        .table thead th { white-space: nowrap; }
        .dt-buttons .btn { margin-right: .25rem; }
    </style>
</head>
<body>
<div class="container py-4">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-building-gear fs-3 text-primary"></i>
            <h1 class="h4 m-0">현장 전층 자재·영업사양 현황</h1>
            <span class="badge text-bg-light border">v1.0</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button id="themeToggle" class="btn btn-outline-secondary btn-sm" title="라이트/다크 전환">
                <i class="bi bi-moon-stars"></i>
            </button>
            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFilters">
                <i class="bi bi-funnel"></i> 필터
            </button>
        </div>
    </div>

    <!-- Hero Search -->
    <div class="hero p-3 p-md-4 mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-6">
                <label for="siteInput" class="form-label fw-semibold">현장번호</label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-123"></i></span>
                    <input id="siteInput" type="text" class="form-control" placeholder="예) HJ-2025-001" />
                </div>
                <div class="form-text">샘플: <a href="#" class="link-primary sample-link" data-sample="HJ-2025-001">HJ-2025-001</a>, <a href="#" class="link-primary sample-link" data-sample="HX-2024-077">HX-2024-077</a></div>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-semibold">옵션</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="mergeSame" checked>
                    <label class="form-check-label" for="mergeSame">동일 자재 합산</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="showZero" checked>
                    <label class="form-check-label" for="showZero">수량 0 표시</label>
                </div>
            </div>
            <div class="col-md-3 text-md-end">
                <button id="btnSearch" class="btn btn-primary btn-lg w-100 w-md-auto">
                    <i class="bi bi-search"></i> 조회
                </button>
            </div>
        </div>
    </div>

    <!-- KPI cards -->
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
            <div class="stat-card p-3 h-100">
                <div class="small text-secondary">현장번호</div>
                <div id="kpiSite" class="fs-5 fw-bold">-</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card p-3 h-100">
                <div class="small text-secondary">층수</div>
                <div id="kpiFloors" class="fs-5 fw-bold">-</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card p-3 h-100">
                <div class="small text-secondary">자재(유니크)</div>
                <div id="kpiUniqueMaterials" class="fs-5 fw-bold">-</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card p-3 h-100">
                <div class="small text-secondary">최종 업데이트</div>
                <div id="kpiUpdated" class="fs-6">-</div>
            </div>
        </div>
    </div>

    <!-- Floor chips -->
    <div id="floorChips" class="mb-2"></div>

    <!-- Tabs -->
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="materials-tab" data-bs-toggle="tab" data-bs-target="#materials" type="button" role="tab">
                <i class="bi bi-box-seam"></i> 자재 현황
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="specs-tab" data-bs-toggle="tab" data-bs-target="#specs" type="button" role="tab">
                <i class="bi bi-sliders2-vertical"></i> 영업사양
            </button>
        </li>
    </ul>
    <div class="tab-content border border-top-0 rounded-bottom p-3 bg-body">
        <!-- Materials Table -->
        <div class="tab-pane fade show active" id="materials" role="tabpanel" aria-labelledby="materials-tab">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="small text-secondary">전층 자재 목록</div>
                <div>
                    <button id="btnExportCSV" class="btn btn-outline-secondary btn-sm"><i class="bi bi-download"></i> CSV 내보내기</button>
                </div>
            </div>
            <div class="table-responsive">
                <table id="tblMaterials" class="table table-hover table-sm w-100">
                    <thead>
                    <tr>
                        <th>층</th>
                        <th>자재번호</th>
                        <th>자재명</th>
                        <th>분류</th>
                        <th>수량</th>
                        <th>비고</th>
                    </tr>
                    </thead>
                    <tbody><!-- filled by JS --></tbody>
                </table>
            </div>
        </div>

        <!-- Specs Table -->
        <div class="tab-pane fade" id="specs" role="tabpanel" aria-labelledby="specs-tab">
            <div class="small text-secondary mb-2">전층 영업사양</div>
            <div class="table-responsive">
                <table id="tblSpecs" class="table table-striped table-sm w-100">
                    <thead>
                    <tr>
                        <th>층</th>
                        <th>도어 타입</th>
                        <th>승객/화물</th>
                        <th>정격하중(kg)</th>
                        <th>속도(m/s)</th>
                        <th>기타</th>
                    </tr>
                    </thead>
                    <tbody><!-- filled by JS --></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Offcanvas Filters -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasFilters">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title"><i class="bi bi-funnel"></i> 필터</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div class="mb-3">
            <label class="form-label">층 범위</label>
            <div class="input-group">
                <span class="input-group-text">최소</span>
                <input id="minFloor" type="number" class="form-control" placeholder="1">
                <span class="input-group-text">최대</span>
                <input id="maxFloor" type="number" class="form-control" placeholder="20">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">자재 분류</label>
            <select id="categoryFilter" class="form-select">
                <option value="">전체</option>
                <option>M</option><option>C</option><option>1</option><option>2</option><option>3</option>
            </select>
        </div>
        <div class="d-grid gap-2">
            <button id="btnApplyFilter" class="btn btn-primary"><i class="bi bi-check2-circle"></i> 적용</button>
            <button id="btnResetFilter" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i> 초기화</button>
        </div>
    </div>
</div>

<!-- JS: Bootstrap & DataTables -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net@1.13.10/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.13.10/js/dataTables.bootstrap5.min.js"></script>

<script>
    // ---------------------------
    // 1) Sample Data
    // ---------------------------
    const SAMPLE = {
        "HJ-2025-001": {
            updated: "2025-10-04 09:00",
            floors: 20,
            materialsByFloor: [
                // floor, code, name, cat, qty, note
                [1, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, "기본"],
                [1, "MAT-CTRL-10", "제어반 메인보드", "C", 1, ""],
                [1, "MAT-LMP-02", "층표시 램프", "2", 1, ""],
                [2, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [2, "MAT-GLS-01", "샤프트 유리패널", "3", 2, "로비 미적용"],
                [3, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [3, "MAT-SNS-05", "안전센서 키트", "1", 1, ""],
                [4, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [4, "MAT-LMP-02", "층표시 램프", "2", 1, ""],
                [5, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [5, "MAT-GLS-01", "샤프트 유리패널", "3", 1, ""],
                [6, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [6, "MAT-SNS-05", "안전센서 키트", "1", 1, ""],
                [7, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [7, "MAT-LMP-02", "층표시 램프", "2", 1, ""],
                [8, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [9, "MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [10,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [11,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [12,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [13,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [14,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [15,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [16,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [17,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [18,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [19,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
                [20,"MAT-DOOR-01", "센터오프닝 도어 세트", "M", 1, ""],
            ],
            specsByFloor: Array.from({length:20}, (_,i)=>({
                floor: i+1,
                door: (i+1)<=10 ? "센터오프닝" : "슬라이딩",
                type: "승객",
                load: (i+1)<=5 ? 800 : (i+1)<=15 ? 1000 : 1200,
                speed: (i+1)<=10 ? 1.5 : 2.0,
                extra: (i+1)%2===0 ? "홀버튼 대형" : "표준"
            }))
        },
        "HX-2024-077": {
            updated: "2024-12-28 14:20",
            floors: 12,
            materialsByFloor: [
                [1, "MAT-DOOR-02", "슬라이딩 도어 세트", "M", 1, ""],
                [1, "MAT-CTRL-12", "인버터 유닛", "C", 1, ""],
                [2, "MAT-DOOR-02", "슬라이딩 도어 세트", "M", 1, ""],
                [3, "MAT-DOOR-02", "슬라이딩 도어 세트", "M", 1, ""],
                [4, "MAT-DOOR-02", "슬라이딩 도어 세트", "M", 1, ""],
                [5, "MAT-PNL-09", "COP 패널", "2", 1, ""],
                [6, "MAT-PNL-09", "COP 패널", "2", 1, ""],
                [7, "MAT-PNL-09", "COP 패널", "2", 1, ""],
                [8, "MAT-PNL-09", "COP 패널", "2", 1, ""],
                [9, "MAT-SNS-08", "로프센서", "1", 1, ""],
                [10,"MAT-SNS-08", "로프센서", "1", 1, ""],
                [11,"MAT-SNS-08", "로프센서", "1", 1, ""],
                [12,"MAT-SNS-08", "로프센서", "1", 1, ""],
            ],
            specsByFloor: Array.from({length:12}, (_,i)=>({
                floor: i+1,
                door: "슬라이딩",
                type: i+1===B1()? "화물":"승객",
                load: i+1===12 ? 1600 : 1000,
                speed: 1.75,
                extra: (i+1)%3===0 ? "디자인 패널" : "표준"
            }))
        }
    };
    function B1(){ return -1 } // just to keep sample fun :)

    // ---------------------------
    // 2) State & Helpers
    // ---------------------------
    let dtMaterials, dtSpecs;
    let currentData = null;
    let filterState = { minFloor: null, maxFloor: null, category: "" };

    function initTables() {
        dtMaterials = $('#tblMaterials').DataTable({
            paging: true, pageLength: 10, lengthChange: false, ordering: true, info: true, searching: true,
            order: [[0,'asc'], [1,'asc']],
            language: { url: "https://cdn.datatables.net/plug-ins/1.13.10/i18n/ko.json" }
        });
        dtSpecs = $('#tblSpecs').DataTable({
            paging: true, pageLength: 10, lengthChange: false, ordering: true, info: true, searching: true,
            order: [[0,'asc']],
            language: { url: "https://cdn.datatables.net/plug-ins/1.13.10/i18n/ko.json" }
        });
    }

    function setKPI(siteId, floors, updated, uniqueCount) {
        document.getElementById('kpiSite').textContent = siteId ?? '-';
        document.getElementById('kpiFloors').textContent = floors ?? '-';
        document.getElementById('kpiUpdated').textContent = updated ?? '-';
        document.getElementById('kpiUniqueMaterials').textContent = uniqueCount ?? '-';
    }

    function buildFloorChips(maxFloor) {
        const wrap = document.getElementById('floorChips');
        wrap.innerHTML = '';
        if (!maxFloor) return;
        const scroll = document.createElement('div');
        scroll.className = 'd-flex flex-wrap gap-2';
        for (let f=1; f<=maxFloor; f++){
            const a = document.createElement('a');
            a.href = '#';
            a.className = 'badge text-bg-light border floor-pill';
            a.textContent = `${f}F`;
            a.onclick = (e)=>{ e.preventDefault(); filterByFloor(f); };
            scroll.appendChild(a);
        }
        wrap.appendChild(scroll);
    }

    function filterByFloor(floor) {
        // quick filter on both tables
        dtMaterials.column(0).search('^'+floor+'$', true, false).draw();
        dtSpecs.column(0).search('^'+floor+'$', true, false).draw();
    }

    function clearFloorFilter() {
        dtMaterials.column(0).search('').draw();
        dtSpecs.column(0).search('').draw();
    }

    function csvExport(rows, headers, filename) {
        const escape = (v)=> `"${String(v).replace(/"/g,'""')}"`;
        const csv = [headers.map(escape).join(',')]
            .concat(rows.map(r=>r.map(escape).join(',')))
            .join('\n');
        const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    }

    function applyFiltersTo(rows) {
        return rows.filter(r=>{
            const [floor, , , cat, qty] = r;
            if (filterState.minFloor && floor < filterState.minFloor) return false;
            if (filterState.maxFloor && floor > filterState.maxFloor) return false;
            if (filterState.category && cat !== filterState.category) return false;
            if (!document.getElementById('showZero').checked && Number(qty)===0) return false;
            return true;
        });
    }

    function mergeSameMaterials(rows) {
        // group by (floor, code) OR all floors? We keep per-floor rows; identical code in same floor sums.
        const map = new Map();
        for (const r of rows){
            const key = `${r[0]}|${r[1]}`;
            const exist = map.get(key);
            if (exist){
                exist[4] = Number(exist[4]) + Number(r[4]); // sum qty
                exist[5] = exist[5] || r[5];
            } else {
                map.set(key, r.slice());
            }
        }
        return Array.from(map.values());
    }

    function uniqueMaterialCount(rows){
        return new Set(rows.map(r=>r[1])).size;
    }

    function render(siteId){
        const data = SAMPLE[siteId];
        currentData = data;
        if (!data){
            setKPI('-', '-', '-', '-');
            buildFloorChips(0);
            dtMaterials.clear().draw();
            dtSpecs.clear().draw();
            alert('해당 현장번호 데이터가 없습니다. (샘플: HJ-2025-001, HX-2024-077)');
            return;
        }

        let rows = data.materialsByFloor.slice();
        rows = applyFiltersTo(rows);
        if (document.getElementById('mergeSame').checked){
            rows = mergeSameMaterials(rows);
        }

        // KPIs
        setKPI(siteId, data.floors, data.updated, uniqueMaterialCount(rows));
        buildFloorChips(data.floors);

        // Materials
        dtMaterials.clear();
        dtMaterials.rows.add(rows);
        dtMaterials.draw();

        // Specs
        const specRows = data.specsByFloor.map(s=>[s.floor, s.door, s.type, s.load, s.speed, s.extra]);
        dtSpecs.clear();
        dtSpecs.rows.add(specRows);
        dtSpecs.draw();

        clearFloorFilter();
    }

    // ---------------------------
    // 3) Event Bindings
    // ---------------------------
    document.addEventListener('DOMContentLoaded', ()=>{
        initTables();

        // default load first sample
        render('HJ-2025-001');

        document.getElementById('btnSearch').addEventListener('click', ()=>{
            const id = document.getElementById('siteInput').value.trim();
            render(id);
        });

        document.querySelectorAll('.sample-link').forEach(a=>{
            a.addEventListener('click', (e)=>{
                e.preventDefault();
                const id = e.target.dataset.sample;
                document.getElementById('siteInput').value = id;
                render(id);
            });
        });

        document.getElementById('btnExportCSV').addEventListener('click', ()=>{
            if (!currentData){ return; }
            const dt = dtMaterials.rows({filter:'applied'}).data().toArray();
            csvExport(dt, ['층','자재번호','자재명','분류','수량','비고'], `materials_${(document.getElementById('kpiSite').textContent||'site')}.csv`);
        });

        document.getElementById('btnApplyFilter').addEventListener('click', ()=>{
            filterState.minFloor = Number(document.getElementById('minFloor').value)||null;
            filterState.maxFloor = Number(document.getElementById('maxFloor').value)||null;
            filterState.category = document.getElementById('categoryFilter').value;
            const offcanvas = bootstrap.Offcanvas.getOrCreateInstance('#offcanvasFilters');
            offcanvas.hide();
            const id = document.getElementById('kpiSite').textContent;
            render(id);
        });

        document.getElementById('btnResetFilter').addEventListener('click', ()=>{
            document.getElementById('minFloor').value = '';
            document.getElementById('maxFloor').value = '';
            document.getElementById('categoryFilter').value = '';
            filterState = {minFloor:null, maxFloor:null, category:""};
            const id = document.getElementById('kpiSite').textContent;
            render(id);
        });

        // Toggle theme (per-session)
        document.getElementById('themeToggle').addEventListener('click', ()=>{
            const html = document.documentElement;
            const current = html.getAttribute('data-bs-theme') || 'light';
            html.setAttribute('data-bs-theme', current === 'light' ? 'dark' : 'light');
        });
    });
</script>
</body>
</html>
