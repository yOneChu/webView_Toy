<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Excel 파일 다운로드</title>

    <!-- ⬇⬇ 여기 주신 CSS를 그대로 붙여넣으세요 ⬇⬇ -->
    <style>
        /* --- 작성하신 CSS 전체를 이 블록에 붙여넣기 --- */
    </style>

    <style>
        /* 화면 배치에 필요한 최소한의 유틸 추가 (기존 스타일과 충돌 없음) */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1rem; }
        .col-12 { grid-column: span 12; }
        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }
        .col-3 { grid-column: span 3; }
        .col-8 { grid-column: span 8; }
        .d-flex { display: flex; align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-8 { gap: 0.5rem; }
        .gap-16 { gap: 1rem; }
        .mt-8 { margin-top: 0.5rem; }
        .mt-16 { margin-top: 1rem; }
        .mb-8 { margin-bottom: 0.5rem; }
        .mb-16 { margin-bottom: 1rem; }
        .w-100 { width: 100%; }
        .text-right { text-align: right; }
        .text-muted { color: var(--hyundai-gray); }
        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .badge.success { background: rgba(40,167,69,.1); color: var(--hyundai-success); }
        .badge.warning { background: rgba(255,193,7,.15); color: #856404; }
        .badge.info { background: rgba(0,102,204,.12); color: var(--hyundai-blue); }
        table { width: 100%; border-collapse: collapse; }
        thead th { background: var(--hyundai-light-gray); text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border-color); font-weight: 600; }
        tbody td { padding: 0.75rem; border-bottom: 1px solid var(--border-color); vertical-align: top; }
        tbody tr:hover { background: #fafbfd; }
        .table-actions { white-space: nowrap; }
        .link { color: var(--hyundai-blue); text-decoration: none; }
        .link:hover { text-decoration: underline; }
        .muted { color: var(--hyundai-gray); font-size: 0.9rem; }
        .search-grid { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 1.2fr auto; gap: 0.75rem; }
        @media (max-width: 900px) {
            .row { grid-template-columns: 1fr; }
            .search-grid { grid-template-columns: 1fr; }
            .text-right { text-align: left; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 헤더 -->
    <div class="card-hyundai" style="overflow:hidden;">
        <div class="card-header-hyundai">
            <div class="d-flex justify-between">
                <div>
                    <h5>Excel 파일 다운로드</h5>
                    <div class="breadcrumb-hyundai mt-8">
                        <span class="breadcrumb-item">자료실</span> /
                        <span class="breadcrumb-item active">Excel 다운로드</span>
                    </div>
                </div>
                <div class="d-flex gap-8">
                    <button id="btnTemplate" class="btn-outline-hyundai">샘플 템플릿 다운로드</button>
                    <button id="btnSelectedDownload" class="btn-hyundai">선택 항목 다운로드</button>
                </div>
            </div>
        </div>

        <!-- 안내 -->
        <div class="alert-hyundai alert-info-hyundai" style="margin:1rem 1.5rem;">
            ※ 필요한 항목을 검색/선택 후 <b>선택 항목 다운로드</b>를 클릭하세요. 최신 생성 파일은 <span class="badge info">NEW</span> 표시됩니다.
        </div>

        <!-- 필터 -->
        <div class="filter-section-hyundai" style="margin: 0 1.5rem 1.5rem 1.5rem;">
            <div class="section-title">검색/필터</div>
            <div class="search-grid">
                <input id="q" class="form-control-hyundai" placeholder="키워드 (파일명/설명) 검색" />
                <select id="category" class="form-control-hyundai">
                    <option value="">전체 카테고리</option>
                    <option value="보고서">보고서</option>
                    <option value="대시보드">대시보드</option>
                    <option value="수배로직">수배로직</option>
                    <option value="교육자료">교육자료</option>
                </select>
                <input id="fromDate" type="date" class="form-control-hyundai" />
                <input id="toDate" type="date" class="form-control-hyundai" />
                <div class="d-flex gap-8">
                    <button id="btnSearch" class="btn-hyundai">검색</button>
                    <button id="btnReset" class="btn-outline-hyundai">초기화</button>
                </div>
            </div>
        </div>

        <!-- 지표 카드 -->
        <div class="row" style="padding: 0 1.5rem 1.5rem 1.5rem;">
            <div class="col-4">
                <div class="stat-card-hyundai" style="padding:1rem 1.25rem;">
                    <div class="stat-label">총 파일</div>
                    <div class="stat-number-hyundai" id="totalCount">0</div>
                    <div class="muted">필터 결과 개수</div>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-card-hyundai" style="padding:1rem 1.25rem;">
                    <div class="stat-label">선택 항목</div>
                    <div class="stat-number-hyundai" id="selectedCount">0</div>
                    <div class="muted">총 용량 <span id="selectedSize">0 KB</span></div>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-card-hyundai" style="padding:1rem 1.25rem;">
                    <div class="stat-label">최근 다운로드</div>
                    <div class="stat-number-hyundai" id="lastDownload">-</div>
                    <div class="muted">마지막 완료 시각</div>
                </div>
            </div>
        </div>

        <!-- 진행률 -->
        <div id="progressWrap" class="filter-section-hyundai" style="margin: 0 1.5rem 1.5rem 1.5rem; display:none;">
            <div class="d-flex justify-between">
                <div class="section-title" style="border-bottom:none; margin-bottom:0;">다운로드 진행률</div>
                <div class="trend-indicator trend-stable" id="progressLabel">0%</div>
            </div>
            <div class="progress-hyundai mt-16">
                <div id="progressBar" class="progress-bar-hyundai" style="width:0%; height:6px;"></div>
            </div>
        </div>

        <!-- 파일 목록 -->
        <div class="card-hyundai" style="margin: 0 1.5rem 1.5rem 1.5rem;">
            <div class="card-header-hyundai d-flex justify-between">
                <h5>파일 목록</h5>
                <div class="d-flex gap-8">
                    <button id="btnSelectAll" class="btn-outline-hyundai">전체 선택</button>
                    <button id="btnClearSel" class="btn-outline-hyundai">선택 해제</button>
                </div>
            </div>

            <div style="padding: 1rem 1.25rem;">
                <div class="chart-container-hyundai" style="height:auto; padding:0; border:none;">
                    <table>
                        <thead>
                        <tr>
                            <th style="width:42px;"><input type="checkbox" id="checkAll" /></th>
                            <th>파일명</th>
                            <th>설명</th>
                            <th style="width:110px;">카테고리</th>
                            <th style="width:120px;">크기</th>
                            <th style="width:160px;">생성일</th>
                            <th style="width:120px;">상태</th>
                            <th style="width:120px;" class="text-right">다운로드</th>
                        </tr>
                        </thead>
                        <tbody id="fileBody">
                        <!-- JS로 렌더링 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 완료 알림 -->
        <div id="successAlert" class="alert-hyundai alert-success-hyundai" style="display:none; margin: 0 1.5rem 1.5rem 1.5rem;">
            ✅ 선택한 <b id="doneCount">0</b>개 파일 다운로드가 완료되었습니다.
        </div>
    </div>
</div>

<script>
    // --- 샘플 데이터 (실서비스에선 서버 응답으로 대체) ---
    const files = [
        { id: 1, name: '월별_비용_집계.xlsx', desc: '월별 프로젝트 비용 요약', sizeKB: 512,  category: '대시보드', created: '2025-10-27', status: '생성완료', isNew: true,  url: '#'},
        { id: 2, name: '부품_공용화_현황.xlsx', desc: '부품별 공용화 지수 및 공급처 정리', sizeKB: 1024, category: '보고서',   created: '2025-10-20', status: '생성완료', isNew: false, url: '#'},
        { id: 3, name: '수배로직_실행결과.xlsx', desc: '자재 수배 결과 세부내역', sizeKB: 870,  category: '수배로직', created: '2025-10-25', status: '검증대기', isNew: false, url: '#'},
        { id: 4, name: '교육_진도현황.xlsx',   desc: '부서별 교육 이수율 및 피드백', sizeKB: 650,  category: '교육자료', created: '2025-10-26', status: '생성완료', isNew: true,  url: '#'},
        { id: 5, name: '설치현황_집계.xlsx',   desc: '현장 설치 진행률 및 이슈', sizeKB: 734,  category: '대시보드', created: '2025-10-18', status: '생성완료', isNew: false, url: '#'}
    ];

    // --- 상태 뱃지 렌더링 ---
    function statusBadge(status, isNew) {
        let cls = 'badge info';
        if (status === '생성완료') cls = 'badge success';
        if (status === '검증대기') cls = 'badge warning';
        const newTag = isNew ? ' <span class="badge info">NEW</span>' : '';
        return `<span class="${cls}">${status}</span>${newTag}`;
    }

    // --- 숫자/용량 포맷 ---
    function fmtSize(kb) {
        if (kb >= 1024 * 1024) return (kb/1024/1024).toFixed(2) + ' GB';
        if (kb >= 1024) return (kb/1024).toFixed(2) + ' MB';
        return kb.toLocaleString() + ' KB';
    }

    // --- 상태 ---
    let filtered = [...files];
    let selectedIds = new Set();

    // --- 렌더링 ---
    const $fileBody = document.getElementById('fileBody');
    const $totalCount = document.getElementById('totalCount');
    const $selectedCount = document.getElementById('selectedCount');
    const $selectedSize = document.getElementById('selectedSize');
    const $lastDownload = document.getElementById('lastDownload');

    function renderTable() {
        $fileBody.innerHTML = '';
        filtered.forEach(f => {
            const checked = selectedIds.has(f.id) ? 'checked' : '';
            const row = document.createElement('tr');
            row.innerHTML = `
          <td><input type="checkbox" class="rowCheck" data-id="${f.id}" ${checked}/></td>
          <td>
            <a class="link" href="${f.url}" title="미리보기/다운로드">${f.name}</a>
            <div class="muted">ID: ${f.id}</div>
          </td>
          <td>${f.desc}</td>
          <td>${f.category}</td>
          <td>${fmtSize(f.sizeKB)}</td>
          <td>${f.created}</td>
          <td>${statusBadge(f.status, f.isNew)}</td>
          <td class="text-right table-actions">
            <button class="btn-outline-hyundai" data-dl="${f.id}">다운로드</button>
          </td>
        `;
            $fileBody.appendChild(row);
        });
        $totalCount.textContent = filtered.length.toString();
        bindRowEvents();
        refreshSelectionStats();
    }

    function bindRowEvents() {
        document.querySelectorAll('.rowCheck').forEach(chk => {
            chk.addEventListener('change', (e) => {
                const id = Number(e.target.dataset.id);
                if (e.target.checked) selectedIds.add(id);
                else selectedIds.delete(id);
                refreshSelectionStats();
            });
        });
        document.querySelectorAll('button[data-dl]').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = Number(btn.dataset.dl);
                startDownload([id]);
            });
        });
    }

    function refreshSelectionStats() {
        const sel = filtered.filter(f => selectedIds.has(f.id));
        const count = sel.length;
        const totalKB = sel.reduce((s, f) => s + f.sizeKB, 0);
        $selectedCount.textContent = String(count);
        $selectedSize.textContent = fmtSize(totalKB);
        document.getElementById('checkAll').checked =
            filtered.length > 0 && filtered.every(f => selectedIds.has(f.id));
    }

    // --- 검색/필터 ---
    function applyFilter() {
        const q = document.getElementById('q').value.trim().toLowerCase();
        const cat = document.getElementById('category').value;
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;

        filtered = files.filter(f => {
            const byQ = !q || (f.name + ' ' + f.desc).toLowerCase().includes(q);
            const byC = !cat || f.category === cat;
            const byF = !from || f.created >= from;
            const byT = !to   || f.created <= to;
            return byQ && byC && byF && byT;
        });

        // 필터 바뀌면 선택 초기화(목록 외 선택 방지)
        const newSel = new Set();
        filtered.forEach(f => { if (selectedIds.has(f.id)) newSel.add(f.id); });
        selectedIds = newSel;

        renderTable();
    }

    // --- 진행률/다운로드 시뮬 ---
    const $progressWrap = document.getElementById('progressWrap');
    const $progressBar = document.getElementById('progressBar');
    const $progressLabel = document.getElementById('progressLabel');
    const $successAlert = document.getElementById('successAlert');
    const $doneCount = document.getElementById('doneCount');

    function startDownload(ids) {
        if (!ids.length) return;

        $successAlert.style.display = 'none';
        $progressWrap.style.display = 'block';
        $progressBar.style.width = '0%';
        $progressLabel.textContent = '0%';

        let p = 0;
        const timer = setInterval(() => {
            p += Math.random() * 18 + 8; // 8~26%씩 증가
            if (p >= 100) {
                p = 100;
                clearInterval(timer);
                finishDownload(ids.length);
            }
            $progressBar.style.width = p.toFixed(0) + '%';
            $progressLabel.textContent = p.toFixed(0) + '%';
        }, 300);
    }

    function finishDownload(count) {
        $doneCount.textContent = String(count);
        $successAlert.style.display = 'block';
        $progressWrap.style.display = 'none';
        const now = new Date();
        const stamp = now.getFullYear() + '-' +
            String(now.getMonth()+1).padStart(2,'0') + '-' +
            String(now.getDate()).padStart(2,'0') + ' ' +
            String(now.getHours()).padStart(2,'0') + ':' +
            String(now.getMinutes()).padStart(2,'0');
        $lastDownload.textContent = stamp;
    }

    // --- 버튼/체크 제어 ---
    document.getElementById('btnSearch').addEventListener('click', applyFilter);
    document.getElementById('btnReset').addEventListener('click', () => {
        document.getElementById('q').value = '';
        document.getElementById('category').value = '';
        document.getElementById('fromDate').value = '';
        document.getElementById('toDate').value = '';
        filtered = [...files];
        selectedIds.clear();
        renderTable();
    });

    document.getElementById('checkAll').addEventListener('change', (e) => {
        if (e.target.checked) filtered.forEach(f => selectedIds.add(f.id));
        else filtered.forEach(f => selectedIds.delete(f.id));
        renderTable();
    });

    document.getElementById('btnSelectAll').addEventListener('click', () => {
        filtered.forEach(f => selectedIds.add(f.id));
        renderTable();
    });

    document.getElementById('btnClearSel').addEventListener('click', () => {
        selectedIds.clear();
        renderTable();
    });

    document.getElementById('btnSelectedDownload').addEventListener('click', () => {
        const ids = filtered.filter(f => selectedIds.has(f.id)).map(f => f.id);
        startDownload(ids);
    });

    document.getElementById('btnTemplate').addEventListener('click', () => {
        // 실제 템플릿 URL로 교체하세요
        startDownload([999]); // 시뮬레이션
        // window.location.href = '/download/template.xlsx';
    });

    // 초기 렌더
    renderTable();
</script>
</body>
</html>
